      {q:'Which of the following CANNOT be considered for selecting a scheme\'s benchmark?',o:['Scheme\'s investment objective','Scheme\'s investment strategy','Scheme\'s asset allocation pattern','Scheme\'s past returns'],a:3,e:'Past returns cannot drive benchmark selection — they are an output. Benchmark must align with objective, strategy, and asset allocation pattern.',topic:'PRF'},
      {q:'Which is the most appropriate measure for evaluating how closely an Index Fund tracks its benchmark?',o:['Treynor Ratio','Tracking Error','Total Expense Ratio','Assets Under Management'],a:1,e:'Tracking Error = standard deviation of (fund return − benchmark return). For index funds, lower tracking error is better.',topic:'PRF'},
      {q:'Among the following debt fund categories, which has the LOWEST credit risk?',o:['Credit risk fund','Corporate bond fund','Dynamic bond fund','Gilt fund'],a:3,e:'Gilt funds invest only in Government Securities — sovereign-rated, virtually no credit risk. Credit risk funds and corporate bond funds carry higher credit risk.',topic:'PRF'}
    ]
  },
  {
    id: 'set_mock5',
    name: 'Mock Test 5 — 30Q (Numerical & Calculation focus)',
    topic: 'MIX',
    duration: 1800,
    description: 'Calculation-heavy mock — NAV math, returns, SIP, TER, Sharpe/Treynor, exit loads. Use the Excel/Calc allowed in the actual exam.',
    questions: [
      {q:'A scheme has total assets of ₹500 crore, total liabilities (including expenses payable) of ₹8 crore, and 25 crore units outstanding. NAV is:',o:['₹19.68','₹19.36','₹20.00','₹20.32'],a:0,e:'NAV = (500 - 8) / 25 = ₹492 / 25 = ₹19.68.',topic:'NAV'},
      {q:'An investor invests ₹1,000 per month via SIP for 3 months. Unit NAVs were ₹10, ₹12.50, and ₹8 respectively. Average NAV per unit acquired (Rupee Cost Average) is approximately:',o:['₹9.80','₹10.00','₹10.17','₹10.50'],a:0,e:'Units: 100, 80, 125 → total 305 units for ₹3,000 → Avg cost = 3000/305 ≈ ₹9.84 (~₹9.80). Lower than the simple average of NAVs (₹10.17) — illustrating Rupee Cost Averaging benefit.',topic:'NAV'},
      {q:'Risk-free return is 6%, scheme return is 14%, scheme standard deviation is 16%. Sharpe Ratio is:',o:['0.40','0.50','0.875','1.00'],a:1,e:'Sharpe = (14 - 6) / 16 = 8/16 = 0.50.',topic:'PRF'},
      {q:'Risk-free return 6%, scheme return 12%, Beta of scheme is 1.5. Treynor Ratio is:',o:['2.0','3.0','4.0','6.0'],a:2,e:'Treynor = (12 - 6) / 1.5 = 6/1.5 = 4.0.',topic:'PRF'},
      {q:'A debt fund has 60% in 5-year bonds and 40% in 1-year bonds. Weighted Average Maturity is:',o:['2.4 years','3.0 years','3.4 years','4.0 years'],a:2,e:'WAM = (0.6 × 5) + (0.4 × 1) = 3.0 + 0.4 = 3.4 years.',topic:'RSK'},
      {q:'NAV grew from ₹100 to ₹146.41 over 4 years. Compounded Annual Growth Rate (CAGR) is approximately:',o:['7%','10%','11.6%','46.4%'],a:1,e:'CAGR = (146.41/100)^(1/4) − 1 = 1.10 − 1 = 10%. Note (1.10)^4 = 1.4641, hence the precise number.',topic:'PRF'},
      {q:'A scheme distributed dividend of ₹2 per unit. NAV before dividend was ₹15. Ex-dividend NAV is:',o:['₹13','₹15','₹17','₹2'],a:0,e:'Ex-dividend NAV = NAV − dividend = 15 − 2 = ₹13. NAV drops by the dividend amount on the ex-dividend date.',topic:'NAV'},
      {q:'An equity scheme has weekly standard deviation of 1.2%. Annualized standard deviation (using sqrt(52)) is approximately:',o:['4.3%','7.2%','8.7%','62.4%'],a:2,e:'Annualized SD = 1.2% × sqrt(52) = 1.2% × 7.21 ≈ 8.65% (~8.7%).',topic:'RSK'},
      {q:'An investor buys at NAV ₹50, redeems at NAV ₹62 with 1% exit load. Effective redemption price is:',o:['₹61','₹61.38','₹62.00','₹62.62'],a:1,e:'Exit load 1% on ₹62 = ₹0.62 deducted. Investor receives ₹62 − ₹0.62 = ₹61.38.',topic:'NAV'},
      {q:'For an equity scheme, AUM ₹1,500 crore. SEBI TER slab structure: 2.25% on first ₹500 cr, 2.00% on next ₹250 cr, 1.75% on next ₹1,250 cr (relevant range). Approximate weighted TER cap is closer to:',o:['1.75%','1.95%','2.10%','2.25%'],a:1,e:'Weighted TER ≈ (500×2.25 + 250×2.00 + 750×1.75) / 1500 = (1125 + 500 + 1312.5)/1500 = ~1.96%.',topic:'NAV'},
      {q:'An investor in 30% tax slab earns ₹10,000 IDCW. After-tax dividend is:',o:['₹7,000','₹8,000','₹9,000','₹10,000'],a:0,e:'IDCW is taxed at slab rate. ₹10,000 × (1 − 0.30) = ₹7,000. (Plus surcharge/cess applicable.)',topic:'TAX'},
      {q:'LTCG of ₹2,50,000 on equity-oriented scheme units. Tax payable (at 12.5% post Budget 2024, ₹1.25L exemption):',o:['₹15,625','₹25,000','₹31,250','₹50,000'],a:0,e:'Taxable LTCG = 2,50,000 − 1,25,000 = ₹1,25,000. Tax = 12.5% × 1,25,000 = ₹15,625.',topic:'TAX'},
      {q:'STCG of ₹50,000 on equity scheme. Tax payable (at 20% post Budget 2024):',o:['₹5,000','₹7,500','₹10,000','₹15,000'],a:2,e:'STCG on equity = 20% × 50,000 = ₹10,000.',topic:'TAX'},
      {q:'A scheme has equity return of 12.5%, benchmark return of 11%, standard deviation of excess return = 3%. Information Ratio is:',o:['0.50','0.66','1.00','1.50'],a:0,e:'IR = (12.5 − 11) / 3 = 1.5/3 = 0.50. Higher IR = more consistent outperformance.',topic:'PRF'},
      {q:'A scheme with Beta 0.8 — when market drops 10%, scheme is expected to drop:',o:['8%','10%','12.5%','12%'],a:0,e:'Scheme move = Beta × Market move = 0.8 × −10% = −8%. Lower Beta means lower volatility relative to market.',topic:'RSK'},
      {q:'A focused equity fund holds 28 stocks. Maximum permitted under SEBI:',o:['25','30','40','50'],a:1,e:'SEBI scheme categorisation caps Focused funds at 30 stocks.',topic:'SCH'},
      {q:'Investor invests ₹5 lakh in a debt fund. Exit load of 1% if redeemed within 1 year. Exits after 8 months at ₹5.4 lakh value. Redemption proceeds (before tax):',o:['₹5,34,600','₹5,40,000','₹5,45,400','₹5,49,000'],a:0,e:'Exit load = 1% × ₹5,40,000 = ₹5,400. Net proceeds = ₹5,40,000 − ₹5,400 = ₹5,34,600.',topic:'NAV'},
      {q:'For a 65:35 hybrid fund, monthly returns of 1.5% (equity) and 0.7% (debt). Blended monthly return is:',o:['1.0%','1.05%','1.22%','1.45%'],a:2,e:'Blended return = 0.65 × 1.5 + 0.35 × 0.7 = 0.975 + 0.245 = 1.22%.',topic:'PRF'},
      {q:'Daily SD of returns is 0.8%. Annualized SD (using sqrt(252)) is approximately:',o:['10.1%','12.7%','15.9%','201.6%'],a:1,e:'Annualized SD = 0.8% × sqrt(252) = 0.8% × 15.87 ≈ 12.70%.',topic:'RSK'},
      {q:'Initial investment ₹1,00,000 grows to ₹1,33,100 in 3 years. CAGR is:',o:['8%','10%','11%','33.1%'],a:1,e:'CAGR = (133100/100000)^(1/3) − 1 = (1.331)^(1/3) − 1 = 1.10 − 1 = 10%. Note (1.10)^3 = 1.331.',topic:'PRF'},
      {q:'A liquid fund returns 6% annualized. Daily approximate compounded return per day:',o:['0.0164%','0.025%','0.05%','0.500%'],a:0,e:'Approx. (1.06)^(1/365) − 1 ≈ 0.000164 = 0.0164% per day. Liquid funds accrue daily — small but consistent.',topic:'NAV'},
      {q:'A scheme has portfolio turnover of 150%. Average holding period of securities is approximately:',o:['1.5 years','1 year','8 months','15 months'],a:2,e:'150% turnover means portfolio is rotated 1.5 times a year. Avg holding period ≈ 12/1.5 = 8 months.',topic:'PRF'},
      {q:'For an investor in 30% tax slab, redeems ₹50,000 STCG from a debt fund (purchased post-April 2023). Tax payable:',o:['₹5,000 (10%)','₹7,500 (15%)','₹10,000 (20%)','₹15,000 (slab rate 30%)'],a:3,e:'Post-April 2023 debt fund gains are taxed at slab rate regardless of holding period. 30% slab × ₹50,000 = ₹15,000.',topic:'TAX'},
      {q:'A scheme with weekly returns: +1%, +2%, −1%, +3%. Average weekly return is:',o:['1.00%','1.25%','1.50%','2.00%'],a:1,e:'(1 + 2 − 1 + 3) / 4 = 5/4 = 1.25% average weekly return.',topic:'PRF'},
      {q:'Scheme NAV moved from ₹20 (start) to ₹25 (mid-year) to ₹22 (year-end). Return for full year is:',o:['+10%','+25%','−12%','+22%'],a:0,e:'Full-year return = (22 − 20) / 20 = 10%. The mid-year peak is irrelevant for the start-to-end measure.',topic:'PRF'},
      {q:'An investor has STCL of ₹30,000 from equity. Can be set off against:',o:['Only equity LTCG','Only equity STCG','Any capital gain (both LTCG and STCG, equity or debt)','Salary income'],a:2,e:'Short-Term Capital Loss can be set off against ANY capital gain (long-term or short-term, equity or debt). Long-Term Capital Loss can only be set off against LTCG.',topic:'TAX'},
      {q:'An equity-oriented FoF that invests in domestic equity-oriented schemes — for taxation, it is treated as:',o:['Debt fund (slab rate)','Equity-oriented (12.5% LTCG)','Hybrid','International fund'],a:1,e:'Post Budget 2024 update: Equity-oriented FoFs that invest ≥90% in equity-oriented schemes can be taxed as equity (12.5% LTCG above ₹1.25L). Verify per latest rules.',topic:'TAX'},
      {q:'Scheme expenses for the period: management fee ₹4 cr, marketing ₹1 cr, custody ₹0.5 cr, audit ₹0.2 cr, brokerage ₹0.8 cr. TER is computed on:',o:['All ₹6.5 cr','₹5.7 cr (excluding brokerage)','Only ₹4 cr (management fee)','₹4.5 cr'],a:1,e:'TER excludes brokerage and STT. Recurring expenses (management, marketing, custody, RTA, audit) total ₹5.7 cr counted in TER.',topic:'NAV'},
      {q:'Trail commission on a SIP of ₹10,000/month at 0.5% p.a. trail, for an investor who has held for 1 year (approx avg AUM ₹65,000). Approx annual trail to distributor is:',o:['₹50','₹325','₹500','₹600'],a:1,e:'Trail = 0.5% × ₹65,000 (approx avg AUM) ≈ ₹325. Trail is small per-investor but recurring & sticky.',topic:'OPS'},
      {q:'A close-ended scheme has 10 cr units outstanding, total NAV ₹15 per unit, but trades on the exchange at ₹13. The discount to NAV is:',o:['10.00%','11.50%','13.30%','15.00%'],a:2,e:'Discount = (15 - 13) / 15 = 13.33%. Close-ended scheme units often trade at discount/premium to NAV in the secondary market.',topic:'SCH'}
    ]
  },
  {
    id: 'set_mock6',
    name: 'Mock Test 6 — 30Q (Distribution, Compliance & Code of Conduct)',
    topic: 'MIX',
    duration: 1800,
    description: 'Mock 6 — distributor practices, AMFI Code of Conduct, advertising rules, grievance redressal, due diligence',
    questions: [
      {q:'The primary role of a mutual fund distributor is to:',o:['Manage scheme portfolios','Analyse the situation of the investor and recommend suitable schemes','Approve scheme launches','Issue NAVs'],a:1,e:'Distributor analyses the INVESTOR (needs, goals, risk profile). Fund manager analyses the MARKET. Both work towards investor\'s financial goals.',topic:'REG'},
      {q:'Among the following, which is NOT a category of mutual fund distributor?',o:['Individual ARN holders','Banks (corporate distributors)','National Distributors','Stock exchanges'],a:3,e:'Stock exchanges are not distributors. Categories: Individual ARN holders, Corporate distributors (banks, NBFCs), National Distributors (large multi-state firms), Online platforms.',topic:'REG'},
      {q:'A distributor must complete which process before getting an ARN from AMFI?',o:['Pass NISM V-A only','Pass NISM V-A and complete KYD (Know Your Distributor)','Get SEBI registration','Get RBI license'],a:1,e:'Pass NISM V-A → Complete KYD (biometric, document verification) → Apply to AMFI for ARN. Without KYD, ARN cannot be issued.',topic:'REG'},
      {q:'An ARN issued by AMFI is valid for:',o:['1 year','3 years','5 years','Lifetime'],a:1,e:'ARN is valid for 3 years. Renewal requires Continuing Professional Education (CPE) compliance.',topic:'REG'},
      {q:'When a distributor offers ONLY execution services (not advice), the EUIN field in the form should be:',o:['Filled with the distributor\'s ARN','Left blank with explicit declaration of execution-only','Filled with the AMC\'s code','Filled with SEBI registration number'],a:1,e:'For execution-only transactions (no advice), EUIN field can be left blank with a signed declaration. This protects against future mis-selling claims.',topic:'REG'},
      {q:'Trail commission to distributors is paid:',o:['Only at the time of investment','Annually as long as the investor holds units','Only on redemption','Only if scheme outperforms benchmark'],a:1,e:'Trail commission is recurring — paid (typically monthly) as long as investor stays invested. Aligns distributor incentive with investor retention.',topic:'REG'},
      {q:'AMFI Code of Conduct prohibits a distributor from:',o:['Educating investors on fund features','Disclosing past performance with disclaimers','Promising or guaranteeing specific returns','Discussing scheme risk profiles'],a:2,e:'Distributors cannot promise or guarantee returns — mutual fund investments are subject to market risks. Code requires fair, transparent dealings.',topic:'REG'},
      {q:'A distributor who has been suspended by AMFI for a regulatory violation:',o:['Can continue distributing through a different ARN','Must surrender the ARN and stop all distribution activity','Can act as advisor instead','Faces no consequence'],a:1,e:'Suspension means the distributor cannot use the ARN. They must stop distribution activity until suspension is lifted. Continuing without authority is a regulatory offence.',topic:'REG'},
      {q:'Grievance redressal for mutual fund investors first goes to:',o:['SEBI directly','SCORES platform directly','The mutual fund / AMC itself','Consumer court'],a:2,e:'Investor must FIRST raise grievance with the AMC. If unresolved within 30 days, escalate to SEBI SCORES. SEBI is not the first port of call.',topic:'REG'},
      {q:'SCORES is:',o:['A scheme rating system','SEBI Complaints Redress System — online platform for investor complaints','A type of mutual fund','SEBI\'s NAV publication system'],a:1,e:'SCORES = SEBI Complaints Redress System. Online portal where investors can file grievances against listed entities and intermediaries when AMC fails to resolve in 30 days.',topic:'REG'},
      {q:'For online execution-only platforms (RIA-exempt distributors), they can offer:',o:['Personalised advice','Only execution-only transactions in direct plans','Both regular and direct plans with advice','Investment management services'],a:1,e:'Pure execution-only platforms can transact in direct plans only and cannot offer personalised advice. If advice is offered, RIA registration is required.',topic:'REG'},
      {q:'Mutual fund advertisements must include the standard warning:',o:['"Mutual funds are guaranteed by SEBI"','"Mutual fund investments are subject to market risks. Read all scheme related documents carefully."','"Past returns are guaranteed in the future"','No warning needed if returns are below 10%'],a:1,e:'The mandatory disclaimer must appear in all MF marketing communication, advertisements, brochures, and SID/SAI/KIM documents.',topic:'REG'},
      {q:'A new SEBI rule mandates that distributors and intermediaries display their registered name and registration number:',o:['On their business cards only','On home page of social media handles AND at beginning of any video/content related to securities markets','In annual reports only','Nowhere mandatorily'],a:1,e:'Recent SEBI rule: registered name and number must appear prominently on social media home pages and at the beginning of all securities-related video/content uploaded by intermediaries.',topic:'REG'},
      {q:'Due diligence by AMC on distributors includes verification of:',o:['Personal income','Compliance history, certifications, past actions, references','Family background','Investment portfolio'],a:1,e:'AMC due diligence covers compliance/regulatory history, NISM/CPE certifications, past disciplinary actions, references — to ensure distributor fits AMFI Code of Conduct.',topic:'REG'},
      {q:'For mis-selling, AMFI Code of Conduct expects distributors to:',o:['Be paid based on commission only','Match products to investor risk profile and document the rationale','Push high-commission schemes','Avoid risk profiling'],a:1,e:'Distributors must match products to risk profile and goals, document the rationale, and avoid pushing high-commission schemes regardless of suitability.',topic:'REG'},
      {q:'Investors\' complaints filed via SCORES are typically expected to be resolved within:',o:['7 days','15 days','30 days','60 days'],a:2,e:'SEBI requires resolution within 30 days from when the entity receives the complaint via SCORES.',topic:'REG'},
      {q:'AMFI Code of Conduct requires distributors to maintain confidentiality of:',o:['Their commission rate','Investor information and transaction details','Scheme NAVs','Public disclosures'],a:1,e:'Investor information, transaction details, and personal data must be kept confidential — used only for the intended purpose. Confidentiality is a core ethical obligation.',topic:'REG'},
      {q:'When a distributor changes (investor wishes to assign units to a new distributor), the procedure is:',o:['Not allowed under SEBI rules','The investor submits a Change of Distributor request to the AMC, which honours it without needing the existing distributor\'s consent','Requires existing distributor\'s NOC','Only via SEBI approval'],a:1,e:'Investors can change distributors freely. AMC processes the request without requiring NOC from the existing distributor. New trail accrues to the new distributor going forward.',topic:'REG'},
      {q:'A distributor receiving an upfront commission for retail investors is:',o:['Permitted up to 1%','Banned by SEBI for retail investors (only trail commission allowed)','Allowed without limit','Permitted only for direct plans'],a:1,e:'Upfront commissions for retail investors are banned. Distributors get only trail commission for retail. (B-30 cities have a small upfront incentive in some categories, with conditions.)',topic:'REG'},
      {q:'EUIN identifies which entity within the distribution chain?',o:['The ARN-holder firm','The individual employee/relationship manager who advised the investor','SEBI itself','The AMC'],a:1,e:'EUIN (Employee Unique Identification Number) identifies the specific employee/RM within the ARN-holder firm. Enables accountability for advice given.',topic:'REG'},
      {q:'A distributor accepting a personal cheque from an investor in their own name (for investing later) is:',o:['Acceptable for small amounts','Strictly prohibited under AMFI Code of Conduct','Permitted with disclosure','A standard practice'],a:1,e:'Accepting investor money in personal account is STRICTLY PROHIBITED. Investor funds must always flow directly to the scheme\'s collection account.',topic:'REG'},
      {q:'A distributor may receive commission for selling mutual funds, but they CANNOT charge investors:',o:['Any direct fee','Direct fees from the investor for distribution (only AMC pays them)','Brokerage','GST'],a:1,e:'Distributors cannot charge investors directly for distribution. They are compensated only by the AMC via commission. RIAs (Registered Investment Advisers) are different and CAN charge fees directly.',topic:'REG'},
      {q:'A scheme that charges TER higher than the SEBI-prescribed slab is:',o:['Permitted with trustee approval','Strictly violation of SEBI regulations','Allowed during NFO only','Permitted for ELSS schemes'],a:1,e:'TER must always remain within SEBI-prescribed slabs. Exceeding is a regulatory violation. The slabs depend on AUM and scheme type.',topic:'NAV'},
      {q:'Direct plans of mutual funds were introduced from:',o:['1 January 2010','1 January 2013','1 April 2018','1 April 2020'],a:1,e:'Direct plans were introduced on 1 January 2013 — they exclude distribution commission and have lower TER, leading to higher net returns over time.',topic:'REG'},
      {q:'Difference between Distributor and Investment Advisor (RIA):',o:['No difference','Distributor receives commission from AMC; RIA charges fees directly from clients and offers advice','RIA is below distributor in seniority','Distributor handles only direct plans'],a:1,e:'Distributor: AMC pays commission, primarily executes/facilitates. RIA: Fee from client, fiduciary advice. Different SEBI registrations and regulatory frameworks.',topic:'REG'},
      {q:'Deployment of funds collected during NFO must follow timelines mentioned in:',o:['SAI','SID (under Regulation 35(5))','KIM only','Trustee discretion'],a:1,e:'Per Regulation 35(5), AMCs must specify realistic deployment timelines in the SID. Failure to deploy as committed may attract regulatory action.',topic:'OPS'},
      {q:'Allotment of units (or refund) for an NFO must be done within:',o:['1 business day of NFO close','3 business days','5 business days of NFO close','15 business days'],a:2,e:'Units must be allotted (or refunds processed) within 5 business days of NFO closure. Open-ended schemes must reopen within 5 business days too.',topic:'OPS'},
      {q:'For mutual fund schemes, an SID is initially valid for:',o:['3 months','6 months','Until a "material change" occurs (with periodic updates within 6 months of FY half-end)','5 years'],a:2,e:'SID remains effective until a material change. Open-ended/Interval scheme SIDs are updated within 6 months of FY half-end (Sept and March data).',topic:'DOC'},
      {q:'AMFI Code of Ethics requires members to observe high standards of:',o:['Profitability','Integrity and fairness in dealings with all stakeholders','Aggressive marketing','Cost reduction'],a:1,e:'AMFI Code of Ethics centres on integrity, fairness, transparency, fiduciary responsibility, and prioritising unitholder interests in all dealings.',topic:'REG'},
      {q:'AMFI requires distributors to keep records of investor transactions for at least:',o:['1 year','3 years','5 years','7 years'],a:2,e:'Distributors must maintain investor transaction records for at least 5 years — standard SEBI/AMFI requirement, though specific retention may vary by transaction type.',topic:'REG'}
    ]
  },
  {
    id: 'set_mock7',
    name: 'Mock Test 7 — 30Q (Specific SEBI rules & investor eligibility)',
    topic: 'MIX',
    duration: 1800,
    description: 'Mock 7 — minimum investor rules, transaction charges, investor categories (NRI/HUF/PoA/OCB), empanelment, offer document specifics',
    questions: [
      {q:'As per SEBI regulations, a mutual fund scheme/plan must have a minimum of __ investors:',o:['10','20','25','50'],a:1,e:'SEBI requires every scheme/plan to have a minimum of 20 investors. This is the "20-25 rule".',topic:'REG'},
      {q:'No single investor in a mutual fund scheme can hold more than __ of the corpus of the scheme/plan:',o:['10%','15%','25%','51%'],a:2,e:'No single investor can hold more than 25% of the corpus. Together with the 20-investor minimum, this is the "20-25 rule" preventing concentration.',topic:'REG'},
      {q:'If the 20-investor minimum or the 25% concentration limit is breached, the AMC must:',o:['Continue regardless','Refund the entire corpus to investors','Rebalance within a SEBI-prescribed cure period or wind up','Increase the corpus'],a:2,e:'AMC must rebalance to comply within a SEBI-prescribed cure period (typically a calendar quarter). If unable to cure, scheme must be wound up and money returned.',topic:'REG'},
      {q:'A first-time mutual fund investor making an investment of ₹10,000 or above through a distributor — the transaction charge deducted and paid to the distributor is:',o:['₹100','₹150','₹200','Nothing — banned'],a:1,e:'For NEW investors, transaction charge of ₹150 per transaction (₹10,000 or above) is deducted from the investment and paid to the distributor. The balance is invested.',topic:'REG'},
      {q:'For an EXISTING mutual fund investor (already invested with any AMC) making a transaction of ₹10,000 or above through a distributor, the transaction charge is:',o:['₹100','₹150','₹200','Nothing'],a:0,e:'For EXISTING investors, transaction charge is ₹100 per transaction (₹10,000 or above), deducted from investment and paid to the distributor.',topic:'REG'},
      {q:'No transaction charge is applicable on:',o:['SIPs of any size','Direct plans / investments below ₹10,000 / SIPs where total investment is below ₹10,000','All ELSS','All HUF investments'],a:1,e:'Transaction charges DO NOT apply to: (a) Direct plans, (b) Investments below ₹10,000, (c) SIPs where total commitment is below ₹10,000, (d) Switches.',topic:'REG'},
      {q:'NRIs (Non-Resident Indians) are eligible to invest in Indian mutual fund schemes:',o:['No, they are barred','Yes, on repatriable or non-repatriable basis as per FEMA','Only in equity schemes','Only in liquid funds'],a:1,e:'NRIs can invest in Indian MFs, on repatriable or non-repatriable basis, complying with FEMA rules. They use NRE/NRO accounts. KYC and FATCA requirements apply.',topic:'OPS'},
      {q:'Overseas Corporate Bodies (OCBs) are __ to invest in Indian mutual funds:',o:['Permitted','Not permitted','Permitted only with RBI approval','Permitted up to ₹10 crore'],a:1,e:'OCBs are NOT permitted to invest in Indian mutual fund schemes (per RBI/FEMA rules; OCB category was de-recognised long ago).',topic:'OPS'},
      {q:'Foreign citizens (non-NRIs, non-FPIs) residing outside India are __ to invest in Indian mutual funds:',o:['Generally permitted','Generally NOT permitted (only specific FPI/QFI routes available)','Permitted with PAN','Permitted via SIP only'],a:1,e:'Foreign citizens cannot directly invest in Indian MFs. They must route via FPI registration or QFI scheme. Mutual funds can permit them only as per regulatory carve-outs.',topic:'OPS'},
      {q:'Hindu Undivided Families (HUFs) wishing to invest in mutual funds:',o:['Cannot invest','Can invest, with the Karta acting on behalf of the HUF and HUF PAN used','Can invest only in liquid funds','Need SEBI special approval'],a:1,e:'HUFs can invest in MFs. Karta operates the folio on behalf of the HUF. HUF PAN is used. KYC of the Karta is required.',topic:'OPS'},
      {q:'A minor investor in mutual funds — when the minor turns 18:',o:['Folio remains in guardian\'s name','Status is changed to "major" by submitting prescribed documents (PAN, KYC, signature, bank account)','Folio gets automatically closed','Units must be redeemed'],a:1,e:'On attaining majority, the investor must submit prescribed documents (PAN, fresh KYC, signature attestation, bank account) to convert the folio from "minor" to "major". The guardian\'s rights cease.',topic:'OPS'},
      {q:'Power of Attorney (PoA) holders for mutual fund investments must:',o:['Submit just the PoA document','Be KYC-compliant themselves AND have the PoA document on record','Get SEBI approval','Have a valid ARN'],a:1,e:'PoA holders must complete KYC themselves AND register the notarised PoA document. Both KYC and PoA are needed before transactions on behalf of the actual investor.',topic:'OPS'},
      {q:'A mutual fund scheme can lend up to __ of its net assets in stock lending, subject to specific conditions:',o:['10%','15%','20%','25%'],a:2,e:'A scheme can lend a maximum of 20% of its net assets to a single approved intermediary, subject to overall lending caps and SEBI conditions.',topic:'REG'},
      {q:'Empanelment of a distributor with an AMC — typically:',o:['Is permanent and cannot be terminated','Can be terminated by the AMC at any time as per the empanelment declaration signed','Can be terminated only by SEBI','Lasts for ARN tenure'],a:1,e:'On empanelment, the distributor signs a declaration giving the AMC the right to terminate empanelment at any time (e.g., for breach of code, regulatory action, conduct issues).',topic:'REG'},
      {q:'A distributor whose ARN has expired can:',o:['Continue selling for one grace year','Not transact (no new business) — but trail commission on existing AUM continues till lapse','Continue all activities','Get automatic renewal'],a:1,e:'If ARN lapses (no CPE renewal), the distributor cannot solicit new business. Trail commission on existing AUM may continue per AMC policy until specific lapse rules trigger.',topic:'REG'},
      {q:'A Value fund (per SEBI scheme categorisation) must invest a minimum of __ in equity and equity-related instruments:',o:['51%','60%','65%','75%'],a:2,e:'Value funds (and Contra funds) must invest at least 65% in equity and equity-related instruments. Mutual fund AMC can offer either Value or Contra — not both.',topic:'SCH'},
      {q:'An AMC offering a Value fund:',o:['Can also offer a Contra fund','Cannot also offer a Contra fund','Must also offer a Growth fund','Must also offer ELSS'],a:1,e:'Per SEBI categorisation, an AMC can offer EITHER a Value fund OR a Contra fund — not both. They\'re considered substitutes.',topic:'SCH'},
      {q:'Dividend yield fund must invest a minimum of __ in dividend-yielding stocks:',o:['51%','65%','75%','100%'],a:1,e:'Dividend Yield funds must invest at least 65% in dividend-yielding stocks (per SEBI categorisation).',topic:'SCH'},
      {q:'The offer document (SID) of a mutual fund scheme must disclose investor grievance history of the AMC for the past:',o:['1 year','2 years','3 fiscal years','5 fiscal years'],a:2,e:'SID must disclose investor grievance history for the past 3 fiscal years — number of complaints received, redressed, pending.',topic:'DOC'},
      {q:'Pending litigation or penalties levied on the sponsors or AMC must be disclosed in the:',o:['Annual report only','Offer document (SID/SAI)','Trustee\'s private files','Need not be disclosed'],a:1,e:'Pending litigation, penalties, and material regulatory actions on sponsors/AMC/trustees MUST be disclosed in the SID and SAI for transparency.',topic:'DOC'},
      {q:'A "Glossary of Defined Terms" in the offer document is:',o:['Optional','Mandatory — must be included','Required only for ELSS','Only for foreign investors'],a:1,e:'A glossary of defined terms is mandatory in the offer document — defines all special terms and abbreviations used in the document for investor clarity.',topic:'DOC'},
      {q:'The Due Diligence Certificate filed with SEBI by the AMC for an NFO confirms that:',o:['The AMC guarantees scheme performance','The draft offer document complies with SEBI regulations and disclosures are true, fair and adequate','SEBI has approved the scheme','Investors will get guaranteed returns'],a:1,e:'Due Diligence Certificate confirms regulatory compliance, completeness, and accuracy of disclosures. It does NOT guarantee performance — that is explicitly disclaimed.',topic:'DOC'},
      {q:'The Due Diligence Certificate must be signed by:',o:['Any AMC employee','The Compliance Officer of the AMC','The Trustee directly','SEBI'],a:1,e:'The Compliance Officer of the AMC must sign the Due Diligence Certificate filed along with the draft offer document.',topic:'DOC'},
      {q:'Mutual fund schemes can buy and sell securities only on:',o:['Speculative basis','Carry-forward basis','Delivery basis','Margin basis'],a:2,e:'Mutual funds can transact only on DELIVERY basis (no carry-forward / speculative trading). This protects unitholders from speculative risk.',topic:'REG'},
      {q:'Heads of expenses that can be charged to a mutual fund scheme are specified by:',o:['Each AMC at its discretion','SEBI (specific heads listed in regulations)','AMFI guidelines only','The trustees'],a:1,e:'SEBI specifies the heads of expenses that can be charged to a scheme (management fees, custodian, RTA, audit, marketing, legal, etc.). AMC cannot charge other heads.',topic:'NAV'},
      {q:'Standard risk factors (in scheme documents) are:',o:['Specific to each scheme','Common to all mutual fund schemes (as prescribed by SEBI)','Optional disclosures','New to a regular investor'],a:1,e:'Standard risk factors are common to all schemes and prescribed by SEBI. Specific risk factors are unique to the particular scheme.',topic:'DOC'},
      {q:'The Sponsor of a mutual fund is responsible or liable for losses to the scheme:',o:['Beyond any limit','Up to the initial contribution made towards setting up the mutual fund','Up to ₹50 crore','For the full corpus'],a:1,e:'The sponsor\'s liability is LIMITED to the initial contribution made towards setting up the mutual fund. This is part of the standard risk factors disclosed.',topic:'STR'},
      {q:'A scheme advertisement claiming guaranteed returns:',o:['Is permitted with disclaimer','Is strictly prohibited unless backed by sponsor guarantee disclosed in SID','Is permitted only for liquid funds','Is allowed in B-30 cities only'],a:1,e:'Guaranteed returns can be claimed ONLY if explicitly backed by a sponsor guarantee disclosed in the SID. Otherwise prohibited under SEBI advertisement code.',topic:'REG'},
      {q:'AMFI is responsible for which of the following?',o:['Conducting the NISM V-A certification examination','Issuing ARN to certified distributors and maintaining industry data','Approving scheme launches','Setting NAV computation methodology'],a:1,e:'AMFI issues ARN, maintains industry data, runs investor awareness, sets best practices. NISM (separate body) conducts certification. SEBI approves/regulates schemes.',topic:'STR'},
      {q:'When an investor in a Pay-out option of IDCW elects to switch to Re-investment of IDCW:',o:['Both options run simultaneously','Re-investment option overrides — going forward, dividends are reinvested as additional units','It is treated as redemption','Not allowed once chosen'],a:1,e:'When investor switches IDCW option, the new election overrides. Going forward, dividends are reinvested at ex-dividend NAV (Re-investment) instead of being paid out (Pay-out).',topic:'OPS'}
    ]
  },
  {
    id: 'set_inv_adv',
    name: 'Set 13 — Investment Landscape (Advanced)',
    topic: 'INV',
    duration: 1200,
    description: 'Risk profiling, behavioural finance edge cases, asset allocation math, rebalancing triggers',
    questions: [
      {q:'When an investor has high "need to take risk" but low "willingness to take risk", the distributor should:',o:['Sell highest-return scheme regardless','Document the conflict and balance toward investor\'s willingness, possibly revising goals','Force the investor to take more risk','Refuse to deal with the investor'],a:1,e:'When need conflicts with willingness, the distributor must respect investor\'s psychological capacity. Document the conflict, possibly revise goal amounts/timelines, never push beyond willingness.',topic:'INV'},
      {q:'Behavioural finance suggests for a long-term equity SIP investor, the optimal NAV-tracking frequency is:',o:['Daily','Weekly','Quarterly or annually — to avoid loss-aversion-driven panic selling','Hourly via app alerts'],a:2,e:'Frequent NAV tracking amplifies loss aversion in volatile equity markets, leading to panic selling at troughs. Quarterly/annual review aligns with long-term horizon.',topic:'INV'},
      {q:'An investor who only invests in their employer\'s sector (IT) due to comfort exhibits:',o:['Recency bias','Familiarity bias + concentration risk','Herd mentality','Overconfidence'],a:1,e:'Familiarity bias — preferring the known. Combined with employer sector concentration, this creates dual exposure (income + investment in same sector) — a serious portfolio risk.',topic:'INV'},
      {q:'Stephen Covey\'s "urgent vs important" matrix applied to financial planning suggests:',o:['Focus only on urgent goals','Focus on important-but-not-urgent goals (retirement, children\'s education) early','Ignore long-term goals','Borrow for urgent goals'],a:1,e:'Covey\'s framework: most people only react to urgent + important (Q1), letting important-not-urgent (Q2 — retirement, education planning) slip until they become Q1 emergencies. Disciplined Q2 focus = wealth building.',topic:'INV'},
      {q:'A "Strategic Asset Allocation" portfolio with 70% equity and 30% debt — typical rebalancing trigger is:',o:['Daily','When deviation crosses ±5% from target band','Only on retirement','Never'],a:1,e:'Practitioners typically rebalance when drift crosses a band (e.g., ±5%) — not at fixed calendar intervals. Avoids excessive trading while maintaining target risk.',topic:'INV'},
      {q:'Real rate of return when nominal return is 7% and inflation is 8% is approximately:',o:['+1%','-0.9% (slightly negative)','0%','+7%'],a:1,e:'Real return = (1+nominal)/(1+inflation) - 1 = 1.07/1.08 - 1 ≈ -0.93%. Earning below inflation means losing purchasing power — slightly negative real return.',topic:'INV'},
      {q:'₹10,000 today, with 8% annual inflation, what amount is needed in 30 years to maintain same purchasing power?',o:['₹46,610','₹70,000','₹1,00,627','₹2,15,892'],a:2,e:'FV = 10,000 × (1.08)^30 ≈ ₹1,00,627. Inflation is brutal over long periods — this is why long-horizon goals must use equity.',topic:'INV'},
      {q:'A bond with longer modified duration is more sensitive to:',o:['Inflation only','Interest rate changes (price moves more for same rate change)','Credit risk','Currency risk'],a:1,e:'Higher modified duration = greater price sensitivity to interest rate changes. A 10-year bond moves more than a 1-year bond for the same rate change.',topic:'INV'},
      {q:'For very short-term needs (under 6 months), the most appropriate asset class is:',o:['Equity (long-term growth)','Real estate','Gold','Liquid/Overnight debt funds (capital preservation, liquidity)'],a:3,e:'Short-term horizons demand capital safety + liquidity. Liquid/overnight debt funds are designed for this. Equity is unsuitable due to short-term volatility.',topic:'INV'},
      {q:'An investor with no current need from investment but a 25-year horizon for retirement should:',o:['Stay in fixed deposits (safety)','Consider higher equity allocation given long horizon and tolerance for short-term volatility','Invest only in gold','Avoid all market-linked products'],a:1,e:'Long horizon = high ability to take risk. If need (retirement growth) and willingness align, equity allocation makes sense — short-term volatility evens out over 25 years.',topic:'INV'},
      {q:'When markets crash 30% and an investor sells everything to "preserve what\'s left", they\'re demonstrating:',o:['Disciplined risk management','Loss aversion + recency bias — likely locking in losses at the bottom','Optimal rebalancing','Tactical asset allocation'],a:1,e:'Selling at troughs is loss aversion (preferring to avoid further loss) + recency bias (extrapolating recent crash forward). Historically catastrophic for long-term wealth.',topic:'INV'},
      {q:'Diversification across asset classes (equity + debt + gold) reduces:',o:['Total portfolio risk through low correlation between assets','Returns proportionally','Tax incidence','Need for risk profiling'],a:0,e:'Diversification across uncorrelated assets reduces portfolio volatility for a given expected return. Different assets perform differently in different cycles.',topic:'INV'}
    ]
  },
  {
    id: 'set_str_adv',
    name: 'Set 14 — MF Structure & Constituents (Advanced)',
    topic: 'STR',
    duration: 1200,
    description: 'Trust deed, AMC obligations, custodian/RTA/auditor specifics, sponsor change procedures',
    questions: [
      {q:'The Trust Deed of a mutual fund is executed between:',o:['SEBI and AMC','Sponsor and Trustees','AMC and unitholders','Custodian and Trustees'],a:1,e:'Trust Deed is between Sponsor (settlor) and Trustees. SEBI prescribes mandatory clauses. Trust Deed governs the trust\'s operation.',topic:'STR'},
      {q:'The Investment Management Agreement (IMA) governs:',o:['Custodian operations','Relationship between Trustees and AMC for managing schemes','Distributor commissions','Investor rights'],a:1,e:'IMA between Trustees and AMC defines how the AMC manages the schemes — investment authority, fees, reporting obligations.',topic:'STR'},
      {q:'The minimum number of independent directors on the Board of Directors of an AMC is:',o:['1/3rd','50% of total directors','2/3rd','All must be independent'],a:1,e:'At least 50% of AMC\'s Board of Directors must be independent — not associated with the sponsor or any entity in the same group.',topic:'STR'},
      {q:'A Custodian must be __ from the Sponsor and AMC:',o:['Same group company','Independent (not affiliated)','Selected by Sponsor without restriction','A subsidiary of AMC'],a:1,e:'Custodian must be SEBI-registered AND independent of the Sponsor/AMC to avoid conflict of interest. Holds securities of the scheme on behalf of unitholders.',topic:'STR'},
      {q:'The Auditor of a mutual fund scheme is appointed by:',o:['AMC','Trustees','SEBI','AMFI'],a:1,e:'Trustees appoint the auditor of the schemes. The auditor must be different from the auditor of the AMC. This is a key check on the AMC.',topic:'STR'},
      {q:'A Registrar and Transfer Agent (RTA) handles:',o:['Investment decisions','Investor records, allotment, redemption, account statements, dividend processing','Custody of securities','Marketing'],a:1,e:'RTAs are SEBI-registered intermediaries that handle the entire investor-facing operational backbone — folio creation, transactions, statements, payouts.',topic:'STR'},
      {q:'A change in controlling interest of the sponsor of a mutual fund requires:',o:['No formal action','Prior SEBI approval AND no-load exit window for unitholders','Just a notice','Trustee discretion'],a:1,e:'Change of sponsor / controlling interest is a material change. Requires SEBI prior approval AND a 30-day no-load exit window for investors who want to exit.',topic:'STR'},
      {q:'The Compliance Officer of an AMC is responsible for:',o:['Investment decisions','Ensuring AMC complies with SEBI regulations and code of conduct','Marketing campaigns','Setting NAVs'],a:1,e:'Compliance Officer ensures regulatory compliance, signs the due diligence certificate for NFOs, and acts as the bridge to SEBI on regulatory matters.',topic:'STR'},
      {q:'An AMC of a mutual fund:',o:['Can be the Trustee of the same fund','Cannot be the Trustee — separation of roles required','Need not be SEBI-registered','Can be a partnership firm'],a:1,e:'AMC and Trustees must be SEPARATE entities — checks-and-balances structure. AMC is a SEBI-registered company appointed by Trustees.',topic:'STR'},
      {q:'CRISIL and ICRA are SEBI-approved as:',o:['Custodians','Valuation agencies for debt securities used in mutual funds','Distributors','RTAs'],a:1,e:'CRISIL and ICRA are the SEBI-approved valuation agencies for debt securities. Their valuations feed into NAV computation for debt holdings.',topic:'STR'},
      {q:'A "Trustee Company" — its Board of Directors must have at least __ independent directors:',o:['One','One-third','Two-thirds','All'],a:2,e:'For Trustee Company, at least 2/3rd of directors must be independent. Stricter than AMC (50%) — given trustees\' fiduciary role to unitholders.',topic:'STR'},
      {q:'The sponsor of a mutual fund must demonstrate:',o:['No specific track record','Sound track record of at least 5 years in financial services + financial soundness','At least ₹1,000 cr net worth','Stock exchange listing'],a:1,e:'Sponsor must have minimum 5-year track record in financial services AND demonstrate financial soundness. SEBI verifies these before granting registration.',topic:'STR'}
    ]
  },
  {
    id: 'set_sch_adv',
    name: 'Set 15 — Scheme Categories (Advanced)',
    topic: 'SCH',
    duration: 1200,
    description: 'Macaulay duration buckets, hybrid sub-categories, multi-cap/flexicap, SIF, lifecycle funds, FoF',
    questions: [
      {q:'A Liquid Fund invests in instruments with Macaulay duration up to:',o:['30 days','60 days','91 days','180 days'],a:2,e:'Liquid funds: portfolio Macaulay duration up to 91 days. Instruments are typically money-market and short-term debt.',topic:'SCH'},
      {q:'An "Ultra Short Duration Fund" has portfolio Macaulay duration of:',o:['Up to 91 days','3 to 6 months','6 to 12 months','1 to 3 years'],a:1,e:'Ultra Short Duration Fund: Macaulay duration 3-6 months. Sits between Liquid and Low Duration in the SEBI debt categorisation.',topic:'SCH'},
      {q:'A "Low Duration Fund" has portfolio Macaulay duration of:',o:['3-6 months','6-12 months','1-3 years','3-4 years'],a:1,e:'Low Duration Fund: Macaulay duration 6-12 months. Higher than Ultra Short, lower than Short Duration.',topic:'SCH'},
      {q:'A "Short Duration Fund" has portfolio Macaulay duration of:',o:['Up to 91 days','6-12 months','1-3 years','3-4 years'],a:2,e:'Short Duration Fund: portfolio Macaulay duration of 1-3 years per SEBI categorisation.',topic:'SCH'},
      {q:'A "Conservative Hybrid Fund" must invest __ in equity:',o:['10-25%','40-60%','65-80%','75-90%'],a:0,e:'Conservative Hybrid: 10-25% equity, 75-90% debt. Lowest equity exposure among hybrid categories.',topic:'SCH'},
      {q:'A "Balanced Hybrid Fund" must invest __ in equity:',o:['10-25%','40-60%','65-80%','75-90%'],a:1,e:'Balanced Hybrid: 40-60% equity, 40-60% debt. Roughly balanced allocation.',topic:'SCH'},
      {q:'An "Aggressive Hybrid Fund" must invest __ in equity:',o:['10-25%','40-60%','65-80%','75-90%'],a:2,e:'Aggressive Hybrid: 65-80% equity, 20-35% debt. Equity-tilted hybrid; taxed as equity-oriented.',topic:'SCH'},
      {q:'A Multi Asset Allocation Fund must invest minimum __ in each of at least __ asset classes:',o:['10% in 3','15% in 3','25% in 4','30% in 2'],a:0,e:'Multi Asset: minimum 10% in EACH of at least 3 asset classes (e.g., equity, debt, gold/REITs).',topic:'SCH'},
      {q:'An Equity Savings Fund typically:',o:['Invests only in debt','Holds equity (≥65% gross via cash + arbitrage), debt, and uses arbitrage to reduce net equity','Is a sector fund','Is a gilt fund'],a:1,e:'Equity Savings: ≥65% in equity (gross — including arbitrage hedges), some debt. Net unhedged equity is lower than gross. Taxed as equity-oriented.',topic:'SCH'},
      {q:'An AMC offering a Multi-cap fund:',o:['Cannot also offer a Flexi-cap fund','Can also offer a Flexi-cap fund (separate categorisation)','Must also offer a Sector fund','Cannot offer Large-cap'],a:1,e:'Multi-cap (25% each in large/mid/small) and Flexi-cap (no cap restrictions, fund manager flexibility) are separate SEBI categories. AMC can offer both.',topic:'SCH'},
      {q:'A Specialized Investment Fund (SIF) is:',o:['A subcategory of mutual funds','A higher-risk category between mutual funds and PMS, with Risk-Band (5 levels) instead of Riskometer','Same as ETF','A retirement fund'],a:1,e:'SIFs are a SEBI-introduced category sitting between MFs and PMS — designed for sophisticated strategies. Use a Risk-Band (5 levels) given higher risk, not the Riskometer.',topic:'SCH'},
      {q:'A Fund of Funds (FoF) investing in equity-oriented MF schemes is currently taxed:',o:['As debt fund (slab rate) for all FoFs','As equity-oriented if it invests ≥90% in domestic equity-oriented schemes (post Budget 2024)','As international fund','As hybrid'],a:1,e:'Post Budget 2024, FoFs investing ≥90% in domestic equity-oriented MF schemes can qualify for equity taxation (12.5% LTCG above ₹1.25L). Other FoFs taxed as debt.',topic:'SCH'}
    ]
  },
  {
    id: 'set_reg_adv',
    name: 'Set 16 — Regulatory & Distribution (Advanced)',
    topic: 'REG',
    duration: 1200,
    description: 'SEBI advertisement code, AMFI Code of Ethics, fit-and-proper, conflict of interest, investor charter',
    questions: [
      {q:'SEBI\'s advertisement code prohibits mutual fund ads from:',o:['Showing past performance with disclaimers','Using forward-looking statements like "guaranteed double in 5 years"','Mentioning Riskometer','Mentioning fund manager name'],a:1,e:'Forward-looking unrealistic claims, guarantees of returns, or projections without basis are prohibited. Past performance with disclaimers and Riskometer are required.',topic:'REG'},
      {q:'Past performance disclosure rule: scheme returns must be shown for periods of:',o:['Last 1 year only','Last 1, 3, 5 years and since inception','Only since inception','Last 10 years'],a:1,e:'Standard disclosure: 1-year, 3-year, 5-year, and since-inception returns alongside benchmark returns for the same periods.',topic:'REG'},
      {q:'The "Mutual Funds Sahi Hai" campaign is an example of:',o:['Individual scheme promotion (banned)','Industry-level investor awareness (permitted by SEBI)','Celebrity endorsement of a scheme','Misleading advertisement'],a:1,e:'Industry-level investor awareness campaigns (where celebrities can be used) are permitted. Individual scheme/AMC celebrity endorsement is NOT permitted.',topic:'REG'},
      {q:'AMFI Code of Ethics centres on:',o:['Profit maximisation for AMCs','Integrity, fairness, and prioritising unitholder interests','Aggressive sales tactics','Cost reduction at AMC level'],a:1,e:'AMFI Code of Ethics: integrity, fairness, fiduciary responsibility to unitholders, transparency, conflict-of-interest avoidance, ethical conduct in all dealings.',topic:'REG'},
      {q:'A potential conflict of interest at AMC level — for example, if AMC employees personally trade in stocks held by schemes — is governed by:',o:['No specific rules','Personal trading / front-running prohibitions in SEBI regulations and AMC code','Just internal policy','Trustee discretion'],a:1,e:'SEBI strictly prohibits personal trading by AMC employees in scheme-held securities (front-running). AMCs must have policies, surveillance, and pre-clearance systems.',topic:'REG'},
      {q:'The SEBI Investor Charter for Mutual Funds covers:',o:['Tax planning advice','Investor rights, redressal mechanisms, expected service standards, list of dos and don\'ts','Specific scheme recommendations','Distributor commissions only'],a:1,e:'Investor Charter (mandated by SEBI) lists investor rights, expected service standards from AMCs, grievance redressal processes, and red flags. Must be prominently displayed.',topic:'REG'},
      {q:'A distributor making personal social media posts about mutual fund schemes must:',o:['Use any content freely','Display registered name and ARN at the start of the content + comply with AMFI/SEBI ad code','Avoid social media','Get SEBI pre-approval for each post'],a:1,e:'Recent SEBI rule: registered name + registration number must appear prominently on social media handles and at the start of any video/content related to securities.',topic:'REG'},
      {q:'AMCs must disclose distributor commissions paid:',o:['Privately to each distributor only','Quarterly on AMC website (top distributors named with commissions paid)','Never','Only to SEBI'],a:1,e:'AMCs must disclose top distributor commissions quarterly on their website — commission disclosure norms enforce transparency on distribution costs.',topic:'REG'},
      {q:'The "Fit and Proper" criteria for empanelling distributors include:',o:['Personal income','Adequate controls to delink sales functions from customer risk/objective evaluation, regulatory history, references','Marital status','Investment portfolio'],a:1,e:'Due diligence by AMCs covers structural controls (delinking sales from suitability assessment), regulatory record, NISM/CPE certifications, references, conduct history.',topic:'REG'},
      {q:'A distributor who has been suspended by AMFI for code violations:',o:['Can register a new ARN to bypass','Must surrender ARN privileges and stop distribution; suspension is publicly disclosed','Continues normally','Faces no consequence'],a:1,e:'AMFI publicly maintains records of suspended/terminated ARNs. Suspended distributors cannot transact through any ARN. Bypassing via fresh ARN is not permitted.',topic:'REG'},
      {q:'For an AMC employee who is also an active investor in their own AMC\'s schemes:',o:['Permitted without disclosure','Permitted with mandatory disclosures and pre-clearance per AMC\'s personal trading policy','Strictly prohibited','Must redeem all units'],a:1,e:'Personal investments by AMC employees are allowed but governed by mandatory disclosure and pre-clearance policies — to prevent front-running and conflicts.',topic:'REG'},
      {q:'For a New Fund Offer (NFO) — celebrity endorsement is:',o:['Permitted with sponsor approval','Strictly prohibited (only industry-level awareness via celebrities is allowed)','Permitted only for ELSS','Permitted with disclaimer'],a:1,e:'Individual scheme / NFO celebrity endorsement is strictly prohibited. Celebrity use is allowed ONLY at industry-level awareness campaigns.',topic:'REG'}
    ]
  },
  {
    id: 'set_doc_adv',
    name: 'Set 17 — Scheme Documents & Disclosures (Advanced)',
    topic: 'DOC',
    duration: 1200,
    description: 'SAI mandatory contents, addendum, monthly portfolio, fund manager changes, factsheet, material change',
    questions: [
      {q:'The Statement of Additional Information (SAI) updation cycle is:',o:['Annually within 3 months of FY-end + material changes on ongoing basis','Quarterly','Half-yearly','Only when scheme changes'],a:0,e:'Regular SAI update: by end of 3 months from financial year-end. Material changes must be updated on an ongoing basis and uploaded to AMC and AMFI websites.',topic:'DOC'},
      {q:'Monthly portfolio disclosure for all mutual fund schemes must be done within:',o:['5 days','10 days from end of month','30 days','At AMC discretion'],a:1,e:'AMCs must disclose month-end portfolio (with ISIN) on their website within 10 days of the month-end.',topic:'DOC'},
      {q:'A "fundamental attribute" change in a scheme includes:',o:['Marketing tagline change','Investment objective, asset allocation pattern, basic structure changes','Logo redesign','Fund manager name'],a:1,e:'Fundamental attributes: investment objective, asset allocation, risk-return profile, fees structure (load), basic scheme structure. These changes need notice + 30-day exit window.',topic:'DOC'},
      {q:'A fund manager change in a scheme must be:',o:['Disclosed to all unitholders only at year-end','Communicated through SID/factsheet update; notice via website + email','Approved by all unitholders','Optional disclosure'],a:1,e:'Fund manager changes are material and must be communicated promptly via SID update, factsheet, AMC website, and unitholder communication (email/SMS).',topic:'DOC'},
      {q:'The Factsheet of a mutual fund scheme is a:',o:['Statutory document required by SEBI','Non-statutory monthly publication providing portfolio + performance snapshot','Document for SEBI internal use','Annual report'],a:1,e:'Factsheet is NOT statutory but is a widely-used monthly publication showing portfolio, NAV, AUM, returns, fund manager, ratios — useful for investor decision-making.',topic:'DOC'},
      {q:'For an open-ended scheme, in case of fundamental attribute change, the public notice must be given in:',o:['Just AMC website','One English daily newspaper with nationwide circulation + regional language newspaper at HO','Only on social media','Optional'],a:1,e:'Public notice must be given in one English daily nationwide + one regional newspaper at the Mutual Fund\'s HO location, with at least 30-day no-load exit window.',topic:'DOC'},
      {q:'Half-yearly portfolio of all schemes must be disclosed by AMC:',o:['On AMC website + sent to unitholders by email','Just on AMC website','Only to SEBI','Only in annual report'],a:0,e:'Half-yearly portfolios must be disclosed on the AMC website AND e-mailed to all registered unitholders. Physical copies are sent on request.',topic:'DOC'},
      {q:'Each scheme NAV must be disclosed by:',o:['9 PM same day','11 PM same day','Next day morning','Within 48 hours'],a:1,e:'NAV must be uploaded to AMFI website by 11 PM on the same business day. AMC must also display NAV on its own website.',topic:'DOC'},
      {q:'The cover page of the SID must contain:',o:['Detailed portfolio holdings','Standard SEBI disclaimer + Riskometer + scheme name + type + AMC details','Past 10-year returns','Fund manager photographs'],a:1,e:'Cover page mandatory contents: SEBI disclaimer (units not approved/recommended by SEBI), Riskometer, scheme name + type, AMC + Trustee contact details, NFO/Reopening dates.',topic:'DOC'},
      {q:'An "addendum" to scheme documents is required when:',o:['Marketing slogan changes','Any change occurs that affects current or prospective investors\' decisions','Daily','Annually'],a:1,e:'Addendum issued for any material change between regular updates — load structure changes, fund manager change, new disclosures, etc. Must accompany KIM until next update.',topic:'DOC'},
      {q:'A scheme\'s "expenses" disclosure in the SID must include:',o:['Only management fee','Maximum recurring expenses (TER), load structure, expense slabs','Just brokerage','Total of past 10 years'],a:1,e:'SID must disclose maximum TER (with slabs), exit load structure, and any other applicable expenses — so investors know upfront the maximum cost they may bear.',topic:'DOC'},
      {q:'The "Performance" section of a scheme\'s SID must show:',o:['Only since-inception','1-year, 3-year, 5-year and since-inception returns + benchmark returns for same periods','Daily NAV','Future return projections'],a:1,e:'Past performance disclosure: 1Y/3Y/5Y/since inception alongside benchmark (TRI) for same periods. Forward-looking projections are prohibited.',topic:'DOC'}
    ]
  },
  {
    id: 'set_nav_adv',
    name: 'Set 18 — NAV, TER & Pricing (Advanced)',
    topic: 'NAV',
    duration: 1200,
    description: 'Segregated portfolio NAV, TER slabs detailed, GST, brokerage exclusions, B-30 specifics',
    questions: [
      {q:'For a segregated portfolio (side-pocket) created on a credit event, the NAV is:',o:['Same as the main portfolio','Computed separately, with the affected security carved out at carrying value or fair value','Always zero','Decided by AMC'],a:1,e:'When a segregated portfolio is created, units are split. Main portfolio continues with healthy assets; segregated portfolio is computed separately with the affected security at fair value (often heavily marked down).',topic:'NAV'},
      {q:'For an equity scheme with AUM of ₹3,000 crore, the SEBI TER slab structure applies:',o:['Flat 2.25% on entire AUM','2.25% on first ₹500cr, 2.00% on next ₹250cr, 1.75% on next ₹1,250cr, 1.60% on next ₹3,000cr, etc.','Flat 1% TER','Decided by AMC'],a:1,e:'SEBI TER slabs (equity): 2.25% / 2.00% / 1.75% / 1.60% / 1.50% / 1.05% on incremental AUM tranches. Larger funds have lower weighted TER.',topic:'NAV'},
      {q:'GST on the management fee is:',o:['Borne by the AMC','Charged within the TER (i.e., included in scheme expenses)','Charged separately to investors','Exempt'],a:1,e:'GST on management fees and other applicable scheme expenses is charged within the TER — investors bear it indirectly. Not charged separately.',topic:'NAV'},
      {q:'Brokerage and Securities Transaction Tax (STT) on the scheme\'s portfolio transactions are:',o:['Included in TER','Excluded from TER (charged additionally to the scheme)','Borne by the AMC','Borne by the distributor'],a:1,e:'Brokerage and STT are EXCLUDED from the TER cap. They are charged additionally to the scheme as transaction costs — but capped at 12 bps for cash-market and 5 bps for derivatives.',topic:'NAV'},
      {q:'For inflows from B-30 cities into open-ended equity-oriented schemes (excluding ETFs/Index Funds), the additional expense allowed is:',o:['Up to 0.30% of AUM (incremental from B-30) — for retail investors only','Flat 1% extra','Flat 2% extra','Not allowed'],a:0,e:'B-30 incentive: up to 0.30% of B-30 incremental AUM. Applies only to retail investor inflows; reversed if redeemed within 1 year.',topic:'NAV'},
      {q:'If the B-30 inflow investor redeems within 1 year, the B-30 incentive amount must be:',o:['Retained by AMC','Recovered/clawed back','Paid to SEBI','Doubled'],a:1,e:'If B-30 investor redeems within 1 year, the additional expense incentive previously claimed by AMC must be clawed back. Prevents abuse for short-term gains.',topic:'NAV'},
      {q:'For a Liquid Fund, NAV must be calculated:',o:['Only on business days','Each calendar day (including weekends and holidays)','Once a week','Once a month'],a:1,e:'Liquid funds calculate NAV for EACH CALENDAR DAY since they hold money market instruments accruing interest daily. Other funds calculate only on business days.',topic:'NAV'},
      {q:'The Maximum TER for an Index Fund / ETF (any AUM) is:',o:['1%','1.5%','2.25%','No cap'],a:0,e:'Index Funds and ETFs are capped at 1% TER given their passive, low-management-cost nature.',topic:'NAV'},
      {q:'For a Fund of Funds (FoF), the SEBI TER cap is:',o:['1%','2.25% (combining FoF expenses + underlying scheme weighted expenses)','3%','No cap'],a:1,e:'FoF TER cap is 2.25%, computed as FoF\'s own TER + weighted average of underlying scheme TERs. Prevents double layering.',topic:'NAV'},
      {q:'NAV decimal places are:',o:['Always 2 decimals','2 for equity, 4 for debt/liquid (to capture daily accruals accurately)','Always 4','At AMC discretion'],a:1,e:'Equity NAVs typically rounded to 2 decimals. Debt/Liquid funds rounded to 4 decimals to capture small daily interest accruals accurately.',topic:'NAV'},
      {q:'For a scheme that has charged additional B-30 expense, the disclosure requirement is:',o:['No specific disclosure','Disclosed in factsheet/SID/AMC website with B-30 AUM details','Disclosed only to SEBI','Disclosed only annually'],a:1,e:'AMC must disclose B-30 AUM and the additional expense charged separately in the factsheet, SID, and on the website — for transparency.',topic:'NAV'},
      {q:'Exit load credited to the scheme:',o:['Reduces TER for remaining unitholders','Goes back to scheme NAV (benefits remaining unitholders)','Goes to AMC profits','Goes to SEBI'],a:1,e:'Exit load is credited to the SCHEME (not the AMC) — directly benefits remaining unitholders by adding to scheme NAV. Aligns interests.',topic:'NAV'}
    ]
  },
  {
    id: 'set_tax_adv',
    name: 'Set 19 — Taxation (Advanced)',
    topic: 'TAX',
    duration: 1200,
    description: 'Indexation, set-off rules, ELSS lock-in mechanics, NRI TDS, stamp duty, bonus units',
    questions: [
      {q:'For ELSS investments via SIP, the 3-year lock-in applies:',o:['Once for the entire SIP from first installment','Separately to EACH SIP installment from its date of investment','Only to first installment','Once SIP completes'],a:1,e:'EACH SIP installment in ELSS is locked-in separately for 3 years from its own investment date. So a 12-month SIP\'s last installment is locked till 3 years after the 12th month.',topic:'TAX'},
      {q:'Section 80C deduction for ELSS investment is available:',o:['In both old and new tax regimes','Only in the OLD tax regime','Only in the new tax regime','For senior citizens only'],a:1,e:'Sec 80C (₹1.5L deduction) for ELSS is available ONLY in the OLD tax regime. The NEW regime offers lower slab rates but no most deductions.',topic:'TAX'},
      {q:'Long-Term Capital Loss (LTCL) on equity-oriented MF can be set off against:',o:['Any income','Only LTCG (long-term capital gains) from any source','Salary income','STCG only'],a:1,e:'LTCL can be set off ONLY against LTCG (any source). It cannot be set off against STCG, salary, or other income. Carry-forward allowed for 8 assessment years.',topic:'TAX'},
      {q:'Short-Term Capital Loss (STCL) can be set off against:',o:['Any capital gain (both STCG and LTCG, equity or debt)','Only STCG','Only LTCG','Salary income'],a:0,e:'STCL is more flexible — can be set off against ANY capital gain (LTCG or STCG, equity or debt). Carry-forward for 8 assessment years.',topic:'TAX'},
      {q:'For an NRI redeeming an equity-oriented scheme (held >12 months) above ₹1.25L exemption, TDS rate is:',o:['10%','12.5% (LTCG rate)','20%','30%'],a:1,e:'Post Budget 2024: TDS for NRIs on LTCG from equity-oriented schemes is 12.5% on amount above ₹1.25L exemption. Different from resident treatment.',topic:'TAX'},
      {q:'For an NRI redeeming an equity-oriented scheme (held ≤12 months), TDS rate is:',o:['10%','15%','20% (STCG rate)','Slab rate'],a:2,e:'Post Budget 2024: TDS for NRIs on STCG from equity-oriented schemes is 20%, matching the new STCG rate.',topic:'TAX'},
      {q:'Stamp duty on mutual fund unit issuance is levied at:',o:['0.001%','0.005% on issuance','0.015% on issuance','0.1%'],a:1,e:'Stamp duty on unit issuance: 0.005% (effective 1 July 2020). Applies to lump-sum, SIP, STP, switch-in, dividend reinvestment.',topic:'TAX'},
      {q:'Stamp duty on transfer of mutual fund units (off-market) is levied at:',o:['0.005%','0.015%','0.1%','Exempt'],a:1,e:'Off-market transfer of MF units (e.g., gifting): stamp duty 0.015%. Higher than issuance rate.',topic:'TAX'},
      {q:'Bonus units allotted by a mutual fund have a cost of acquisition for tax purposes of:',o:['Same as original units','Zero (NIL)','NAV on the day of bonus','Decided by investor'],a:1,e:'For tax computation, bonus units have ZERO cost of acquisition. When sold, the entire sale value is capital gain. Holding period reckoned from bonus issue date.',topic:'TAX'},
      {q:'Indexation benefit (currently) is available for:',o:['Equity-oriented LTCG','Debt fund LTCG ONLY for purchases made BEFORE 1 April 2023','All MF gains','Bonus units only'],a:1,e:'Indexation now applies only to debt fund units PURCHASED before 1 April 2023, when held long-term. Post-April 2023 debt purchases are slab-rate taxed without indexation.',topic:'TAX'},
      {q:'A switch from a regular plan to a direct plan within the same scheme is:',o:['Not a taxable event','A taxable event — capital gain/loss must be computed','Tax-free for ELSS','Free of any tax for first switch'],a:1,e:'Plan switch (regular → direct) is treated as redemption + fresh subscription. Capital gain/loss is computed. Holding period for original units determines tax treatment.',topic:'TAX'},
      {q:'For STT on equity-oriented MF redemption — STT is paid by:',o:['The AMC','The investor (deducted from redemption proceeds)','SEBI','The distributor'],a:1,e:'STT is borne by the investor — deducted from redemption proceeds. Rate is small but applies on equity-oriented scheme redemption/switch-out.',topic:'TAX'}
    ]
  },
  {
    id: 'set_ops_adv',
    name: 'Set 20 — Investor Services (Advanced)',
    topic: 'OPS',
    duration: 1200,
    description: 'Time stamping, NACH/SI, transmission, dormant folios, MITRA, voluntary lock-in, e-KYC',
    questions: [
      {q:'Time stamping of mutual fund transactions is done at:',o:['Distributor\'s office','Official Points of Acceptance (OPoAs) registered with the AMC','Investor\'s home','SEBI office'],a:1,e:'Time stamping is at OPoAs (Official Points of Acceptance), which include AMC offices, RTA offices, designated branches. Cut-off time is determined by OPoA receipt time.',topic:'OPS'},
      {q:'A distributor accepting an application from an investor must forward it to the OPoA:',o:['Within a week','At the earliest possible — cut-off time is determined by OPoA receipt','At month-end','When convenient'],a:1,e:'Distributor receipt is NOT cut-off-relevant. The OPoA receipt time is. Distributor must forward applications quickly to ensure investor\'s intended cut-off is met.',topic:'OPS'},
      {q:'NACH (National Automated Clearing House) is used in mutual funds for:',o:['NAV publication','Auto-debit of SIP installments from investor\'s bank account','Investor KYC','Stock trading'],a:1,e:'NACH mandate authorises the AMC/RTA to debit the investor\'s bank account on SIP dates automatically. Standardised under NPCI.',topic:'OPS'},
      {q:'Standing Instruction (SI) for SIPs is set up via:',o:['SEBI directly','The investor\'s bank, instructing periodic transfer to the scheme','RTA','Distributor'],a:1,e:'Standing Instructions are bank-level periodic transfer mandates. Alternative to NACH; fewer banks support modern SI but it\'s available.',topic:'OPS'},
      {q:'In a Micro-SIP (annual investment ≤ ₹50,000), the investor uses:',o:['PAN','PEKRN (PAN Exempt KYC Reference Number) + alternative photo-ID','Aadhar only','Driving licence only'],a:1,e:'Micro-SIPs are PAN-exempt up to ₹50,000/year per MF. Investor uses PEKRN + alternative photo-ID (Voter, DL, Passport etc.). Cumulative limit applies.',topic:'OPS'},
      {q:'e-KYC via UIDAI (Aadhaar OTP-based) for mutual fund accounts is permitted with limits — the investment cap on accounts opened through OTP-based e-KYC is typically:',o:['₹10,000','₹50,000 per year (aggregate across MFs)','₹1 lakh','Unlimited'],a:1,e:'OTP-based e-KYC has a per-investor annual investment cap (₹50,000 aggregate) due to lighter verification. Full biometric e-KYC or in-person KYC removes this cap.',topic:'OPS'},
      {q:'CKYC (Central KYC Records Registry) and KRA-KYC are:',o:['Same thing','Different — CKYC is wider (whole financial sector via CERSAI), KRA-KYC is securities-market specific','Both run by SEBI','Both run by AMFI'],a:1,e:'CKYC: cross-sector (CERSAI under PML Rules), covers all financial services. KRA: SEBI-registered, securities-market-specific. Both aim to centralise KYC; complementary.',topic:'OPS'},
      {q:'MITRA (Mutual Fund Investment Tracing and Retrieval Assistant) is hosted by:',o:['SEBI','Two Qualified RTAs — CAMS and KFin Technologies','AMFI','Each AMC separately'],a:1,e:'MITRA is hosted by CAMS and KFin (the two QRTAs). Allows investors to trace inactive/unclaimed folios across the industry. Reduces unclaimed assets.',topic:'OPS'},
      {q:'A "dormant" or inactive folio is one where:',o:['NAV declines by 50%','No financial transaction has occurred for a specified period','Investor changes address','SIP gets paused'],a:1,e:'Dormant folio = no financial transactions for a specified period (varies, typically 1-2 years for monitoring; longer for true inactivity). Triggers re-verification of KYC and contact details.',topic:'OPS'},
      {q:'Voluntary lock-in / debit freeze on a mutual fund folio (recently introduced by SEBI) is:',o:['Mandatory for all investors','Optional — investor can lock units to prevent unauthorised redemption','Imposed by AMC','Imposed by SEBI'],a:1,e:'SEBI introduced voluntary debit freeze (March 2026 circular) — investors can voluntarily lock units to prevent unauthorised redemption. Available across demat and SoA folios via MF Central.',topic:'OPS'},
      {q:'Transmission of units (in case of unitholder\'s demise) requires the nominee/legal heir to submit:',o:['Just the death certificate','Death certificate, KYC of claimant, transmission request, may need succession proof if no nominee','Just a request letter','SEBI approval'],a:1,e:'Transmission docs: death certificate, KYC of nominee/legal heir, transmission request form. If no nominee, succession certificate or probate is required (which is much harder).',topic:'OPS'},
      {q:'A nomination on a mutual fund folio:',o:['Cannot be changed once registered','Can be changed at any time by the unitholder by submitting a fresh nomination form','Requires SEBI approval to change','Requires consent of existing nominee'],a:1,e:'Unitholder can change nomination anytime via fresh nomination form. New nomination overrides earlier. No consent of existing nominee needed (it\'s the unitholder\'s right).',topic:'OPS'}
    ]
  },
  {
    id: 'set_rsk_adv',
    name: 'Set 21 — Risk & Returns (Advanced)',
    topic: 'RSK',
    duration: 1200,
    description: 'Macaulay vs Modified duration, convexity, credit rating profile, single-issuer caps, group exposure',
    questions: [
      {q:'The relationship between Macaulay Duration (MacD) and Modified Duration (ModD) is:',o:['Always equal','ModD = MacD / (1 + YTM/n) — ModD slightly less than MacD','MacD = ModD × 2','No relationship'],a:1,e:'ModD = MacD / (1 + YTM/n) where n is compounding frequency. ModD is always slightly less than MacD. ModD measures price sensitivity directly; MacD measures weighted average time to receive cash flows.',topic:'RSK'},
      {q:'Convexity, as a bond risk measure:',o:['Substitutes for duration','Measures the curvature of price-yield relationship — refines duration\'s linear approximation for large rate changes','Same as Beta','Only applies to equity'],a:1,e:'Convexity captures the second-order (curvature) relationship between bond prices and yields. Duration alone is a linear approximation; convexity refines it for large rate moves.',topic:'RSK'},
      {q:'A scheme with high credit rating profile (e.g., 80% AAA, 20% AA) has:',o:['Higher credit risk','Lower credit risk (high-grade portfolio)','Higher interest rate risk','Lower NAV'],a:1,e:'AAA is the highest credit rating; AA is also investment grade. Higher allocation to AAA = lower credit risk. Doesn\'t affect interest rate risk directly.',topic:'RSK'},
      {q:'A scheme can hold a maximum of ___ of its NAV in securities issued by a SINGLE issuer (debt):',o:['5%','10% (with extensions to 12% under specific conditions)','15%','25%'],a:1,e:'SEBI single-issuer cap: 10% in debt securities of a single issuer (extendable to 12% with specific board approvals). Reduces concentration risk.',topic:'RSK'},
      {q:'A scheme\'s exposure to a "Group" (related parties) of issuers is capped at:',o:['10% of NAV','25% of NAV (with conditions)','40%','No cap'],a:1,e:'Group exposure cap: typically 25% of NAV for debt securities issued by entities within the same business group. Prevents concentration in a single group\'s credit.',topic:'RSK'},
      {q:'Side-pocketing (segregated portfolio) — only investors holding units AT THE TIME OF the credit event:',o:['Get nothing','Receive units in the segregated portfolio; future buyers do NOT get exposure to the affected security','Get cash','Get refunded'],a:1,e:'Only existing unitholders at the credit-event cut-off date receive units in the segregated portfolio. New investors entering after that date are not exposed to the legacy bad asset.',topic:'RSK'},
      {q:'Recoveries from a side-pocketed (segregated) instrument are:',o:['Distributed pro-rata to unitholders of the segregated portfolio','Retained by AMC','Paid to SEBI','Reinvested'],a:0,e:'Any recovery from the segregated security (when it pays back, partially or fully) is distributed pro-rata to the unitholders of the segregated portfolio.',topic:'RSK'},
      {q:'Gating (restriction on redemption) — the first ___ of any redemption request must be processed without restriction:',o:['₹50,000','₹1 lakh','₹2 lakhs','₹5 lakhs'],a:2,e:'Per SEBI: first ₹2 lakhs of any redemption request is processed without gating. Amounts above ₹2 lakhs are subject to the restriction.',topic:'RSK'},
      {q:'Gating can be invoked for a maximum of:',o:['5 working days in any 90-day period','10 working days in any 90-day period','30 working days in a year','Indefinitely'],a:1,e:'Gating: max 10 working days in any 90-day period. Requires Board of AMC + Trustees approval. SEBI must be informed immediately. Used only for systemic crises.',topic:'RSK'},
      {q:'For a scheme to qualify as Conservative Hybrid (10-25% equity), the average exposure is computed:',o:['On NAV daily','On a quarterly average basis','Annual','At the AMC\'s discretion'],a:1,e:'Equity exposure for hybrid categorisation is typically measured on a quarterly average basis to avoid daily breach issues from market volatility.',topic:'RSK'},
      {q:'Stress testing for liquid funds (SEBI mandate) requires:',o:['No specific testing','Periodic simulation of large redemption scenarios + portfolio liquidity assessment','Only year-end testing','Optional'],a:1,e:'SEBI mandates AMCs to conduct stress tests on liquid funds — simulating large redemption pressure and assessing portfolio liquidity. Results disclosed periodically.',topic:'RSK'},
      {q:'The Riskometer of a scheme can change based on portfolio composition. AMC must:',o:['Disclose only at year-end','Re-evaluate monthly + communicate any change to unitholders via notice-cum-addendum + SMS/email','Wait until SEBI asks','No need to inform unitholders'],a:1,e:'Riskometer must be re-evaluated monthly. Any change must be communicated via notice-cum-addendum AND SMS/email to unitholders. Transparency is mandatory.',topic:'RSK'}
    ]
  },
  {
    id: 'set_prf_adv',
    name: 'Set 22 — Performance & Selection (Advanced)',
    topic: 'PRF',
    duration: 1200,
    description: 'Information Ratio mechanics, tier-1/tier-2 benchmarks, factsheet, peer analysis, style drift',
    questions: [
      {q:'Information Ratio (IR) is calculated using a benchmark — which benchmark must be used per SEBI?',o:['Any AMC-chosen benchmark','The Tier-1 benchmark for the scheme as disclosed in the SID','Sensex always','Investor\'s preferred index'],a:1,e:'IR computation must use the Tier-1 benchmark disclosed in the SID. SEBI\'s Jan 2025 circular mandates this for standardisation.',topic:'PRF'},
      {q:'A "Tier-1" benchmark for a mutual fund scheme is:',o:['The primary benchmark closely aligned with scheme objective and asset allocation','A secondary or peer-group comparison index','Always Sensex','Decided by investors'],a:0,e:'Tier-1 = primary benchmark, closely tracking the scheme\'s investment universe. Tier-2 = broader comparison index (e.g., overall market). Both may be disclosed.',topic:'PRF'},
      {q:'A "Tier-2" benchmark is typically:',o:['Same as Tier-1','A broader / peer-group benchmark for comparative perspective (e.g., overall market index)','A debt benchmark','Mandatory for ETFs only'],a:1,e:'Tier-2 benchmark provides additional comparative context — broader market or peer category. Helps investors compare scheme vs broader universe.',topic:'PRF'},
      {q:'For a Hybrid scheme with 65% equity / 35% debt, an appropriate Tier-1 benchmark is:',o:['Pure Sensex','A blended index: 65% equity index + 35% debt index','Pure G-Sec index','Gold price'],a:1,e:'Hybrid schemes use synthetic/blended benchmarks reflecting actual asset allocation. E.g., 65% Sensex/Nifty + 35% I-Bex (or CRISIL Hybrid Index).',topic:'PRF'},
      {q:'Style drift — when a fund\'s holdings deviate over time from its stated investment style — is:',o:['Always permitted','A red flag investors should monitor (e.g., a "value" fund buying high-P/E growth stocks)','Required by SEBI','Common and acceptable'],a:1,e:'Style drift is when a fund\'s actual holdings deviate from its stated mandate (Value/Growth/Large-cap, etc.). Investors should monitor — SEBI regulations now restrict it via clearer scheme categorisation.',topic:'PRF'},
      {q:'"Survivorship bias" in mutual fund performance data refers to:',o:['Only winning schemes get more inflows','Performance averages computed only on schemes still in existence — failed/merged schemes excluded, biasing averages upward','SIPs surviving market crashes','Long-running schemes'],a:1,e:'Survivorship bias: when computing category averages, schemes that closed/merged/underperformed get excluded — making the surviving sample look better than the historical reality.',topic:'PRF'},
      {q:'"Active Share" of a fund measures:',o:['How active the fund manager is daily','Percentage of the portfolio that differs from the benchmark — high active share means the fund is genuinely active','Tracking error','Sharpe Ratio'],a:1,e:'Active Share = % of holdings differing from the benchmark. Low active share = "closet indexer" charging active fees. High active share = genuine active management.',topic:'PRF'},
      {q:'A "Closet Index Fund" is:',o:['A passive index fund','An "active" fund whose portfolio closely mirrors the index, but charges active fees — bad value for investors','A liquid fund','A new category'],a:1,e:'Closet indexer: charges active management fees but actually replicates the index. Low active share, low alpha potential. Investor pays for nothing — bad value.',topic:'PRF'},
      {q:'For evaluating a debt fund\'s manager skill, the most relevant risk-adjusted measure is:',o:['Sharpe Ratio (uses Standard Deviation — captures total risk for debt)','Treynor Ratio (uses Beta — less relevant for debt)','Tracking Error','Alpha'],a:0,e:'For debt funds, Beta is less meaningful. Sharpe Ratio (using Standard Deviation as risk measure) is preferred. Treynor and Alpha are best for diversified equity.',topic:'PRF'},
      {q:'Portfolio Turnover Ratio of a scheme indicates:',o:['Number of investors','Frequency of trading by the fund manager — high turnover increases transaction costs but can reflect tactical activity','TER','AUM'],a:1,e:'Turnover Ratio = (lower of buys/sells) / avg AUM. High turnover = active trading (costs higher); low = buy-and-hold style. Should be matched against alpha generated.',topic:'PRF'},
