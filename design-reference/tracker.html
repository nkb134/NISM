      {q:'When comparing two equity schemes, all else equal, a LOWER expense ratio (TER) typically:',o:['Hurts long-term returns','Helps long-term net returns to investors (lower drag = more compounding)','Has no effect','Increases tracking error'],a:1,e:'TER drag compounds over time. A 0.5% TER difference compounds to significant gap over 20-30 years. Lower TER directly improves net investor returns.',topic:'PRF'},
      {q:'A scheme that consistently has HIGH Sharpe Ratio + HIGH Information Ratio + LOW tracking error (vs benchmark) is:',o:['Likely a closet indexer','Likely a high-quality, consistent active manager generating alpha with controlled risk','Underperforming','Just lucky'],a:1,e:'High Sharpe (good risk-adjusted return) + high IR (consistent excess return vs benchmark) + low tracking error (consistency) = strong, repeatable active management. Rare but the gold standard.',topic:'PRF'}
    ]
  },
  {
    id: 'set_mock8',
    name: 'Mock Test 8 — 30Q (Advanced/Edge-case mix)',
    topic: 'MIX',
    duration: 1800,
    description: 'Cross-topic mock pulling from advanced/edge-case content. Higher difficulty than Mocks 1-3.',
    questions: [
      {q:'A scheme triggers gating when redemption requests exceed liquidity. The first ₹2 lakhs of every request:',o:['Subject to gating','Must be processed without restriction','Frozen for 30 days','Carried over'],a:1,e:'SEBI rule: first ₹2 lakhs of any redemption request must be processed without restriction during gating. Only excess above ₹2 lakhs is subject to gating.',topic:'RSK'},
      {q:'For ELSS investments via SIP, lock-in is computed:',o:['From the first SIP installment for all units','Separately for EACH SIP installment from its own date','From SIP completion','Once a year'],a:1,e:'Each ELSS SIP installment locks separately for 3 years from its individual investment date.',topic:'TAX'},
      {q:'The "Active Share" metric of an actively managed fund refers to:',o:['Trading frequency','Percentage of portfolio holdings that differ from the benchmark','Systematic share component','Cash component'],a:1,e:'Active Share = portion of portfolio different from benchmark. High active share = genuinely active management.',topic:'PRF'},
      {q:'Modified Duration is approximately related to Macaulay Duration as:',o:['ModD = MacD × 2','ModD = MacD / (1 + YTM/n)','ModD = MacD + 1','Unrelated'],a:1,e:'ModD = MacD ÷ (1 + YTM/n). ModD is slightly less than MacD and gives direct price-sensitivity to rate changes.',topic:'RSK'},
      {q:'For a non-resident Indian (NRI) selling equity-oriented MF units held >12 months — TDS rate (post Budget 2024) on amount above ₹1.25L:',o:['10%','12.5%','15%','20%'],a:1,e:'NRI LTCG TDS on equity-oriented MF: 12.5% on gains above ₹1.25L. Matches resident LTCG rate post Budget 2024.',topic:'TAX'},
      {q:'A scheme can hold up to ___ of its NAV in securities of a single issuer (debt):',o:['5%','10% (extendable to 12% with conditions)','20%','25%'],a:1,e:'SEBI single-issuer cap: 10% of NAV in debt of a single issuer, extendable to 12% with specific approvals.',topic:'RSK'},
      {q:'B-30 incentive for retail investor inflows from beyond top-30 cities is up to ___ of the additional AUM:',o:['0.10%','0.30%','0.50%','1.00%'],a:1,e:'B-30 incentive: up to 0.30% (30 bps) of additional AUM from B-30 retail investors. Clawed back if redeemed within 1 year.',topic:'NAV'},
      {q:'CKYC and KRA-KYC differ in that:',o:['Both are identical','CKYC is wider (whole financial sector via CERSAI), KRA-KYC is securities-market specific','KRA is run by RBI','Only CKYC has IPV'],a:1,e:'CKYC: cross-financial-sector (CERSAI under PML Rules). KRA: SEBI-registered, securities-market only. Complementary systems.',topic:'OPS'},
      {q:'MITRA (the unclaimed-mutual-fund-folio platform) is run by:',o:['SEBI directly','CAMS and KFin (the two QRTAs) as agents of AMCs','AMFI alone','Each AMC separately'],a:1,e:'MITRA is hosted by CAMS and KFin (two Qualified RTAs) as agents of AMCs. Helps trace inactive/unclaimed mutual fund folios.',topic:'OPS'},
      {q:'A new SEBI rule (March 2026) introduced a "voluntary debit freeze" facility — its purpose is to:',o:['Force SIP discontinuation','Allow investors to lock units against unauthorised redemption','Increase regulator powers','Replace KYC'],a:1,e:'Voluntary lock-in / debit freeze allows investors to proactively lock units to prevent unauthorised redemption. Available via MF Central platform across demat and SoA folios.',topic:'OPS'},
      {q:'A close-ended scheme typically:',o:['Sells/repurchases units daily','Has a fixed maturity, NFO units listed on stock exchange for trading; AMC does not repurchase','Allows daily SIP','Has open-ended structure'],a:1,e:'Close-ended schemes have fixed maturity. After NFO closure, units are listed on the exchange — investors must transact via the exchange (often at discount/premium to NAV).',topic:'SCH'},
      {q:'For a Specialized Investment Fund (SIF), instead of the Riskometer, the risk indicator is:',o:['Riskometer with 7 levels','Risk-Band with 5 levels (Level 1 lowest, Level 5 highest)','None','Same Riskometer'],a:1,e:'SIFs use a Risk-Band with 5 levels — given they\'re higher-risk than mutual funds. Risk-Band level evaluated monthly.',topic:'DOC'},
      {q:'The Compliance Officer of an AMC signs:',o:['Daily NAV statement','The Due Diligence Certificate filed with SEBI for NFO','Investor account statements','SEBI regulations'],a:1,e:'Compliance Officer signs the Due Diligence Certificate confirming regulatory compliance and disclosure adequacy. Filed along with the draft offer document.',topic:'STR'},
      {q:'Bonus units in a mutual fund scheme have a cost of acquisition for tax of:',o:['Original NAV','NIL (zero)','Current NAV','Decided by investor'],a:1,e:'Bonus units: zero cost of acquisition. When sold, entire sale value is capital gain. Holding period reckoned from bonus issue date.',topic:'TAX'},
      {q:'For a Real Estate Investment Trust (REIT) — it is regulated by:',o:['RBI','SEBI under SEBI (REIT) Regulations','IRDAI','PFRDA'],a:1,e:'REITs (and InvITs) are regulated by SEBI. Mutual fund schemes can hold REIT units, with prescribed allocation limits.',topic:'SCH'},
      {q:'A switch from a regular plan to a direct plan within the same scheme is:',o:['Tax-free','Treated as redemption + fresh subscription (capital gains tax applies; exit load may apply)','Free for first switch','Banned'],a:1,e:'Plan switches are taxable events. Capital gain/loss is computed; exit load may apply. Investors should evaluate net benefit after tax/load.',topic:'TAX'},
      {q:'Style Drift in a fund refers to:',o:['Manager changing','Holdings deviating over time from the fund\'s stated investment style/mandate','Benchmark change','NAV decline'],a:1,e:'Style drift: when a fund\'s actual holdings drift from its stated style (e.g., a "value" fund buying growth stocks). Reduced after SEBI tightened scheme categorisation.',topic:'PRF'},
      {q:'For an Equity Savings Fund — equity exposure (≥65%) is calculated INCLUDING:',o:['Only direct equity','Direct equity + arbitrage hedged equity (gross equity)','Excluding all equity','Cash and equivalents'],a:1,e:'Equity Savings: gross equity (direct + arbitrage) ≥65% qualifies it as equity-oriented for tax. Net unhedged equity is much lower — providing a smoother return profile.',topic:'SCH'},
      {q:'Past performance disclosure in scheme advertisements must show returns for:',o:['Only since inception','1, 3, 5 years and since inception (alongside benchmark for same periods)','Last quarter only','Past 10 years'],a:1,e:'Standard disclosure: 1Y/3Y/5Y/SI returns + benchmark TRI for same periods. Forward-looking projections prohibited.',topic:'REG'},
      {q:'A "fundamental attribute" of a scheme that requires notice + 30-day exit window includes:',o:['Marketing slogan','Investment objective, asset allocation pattern, basic structure','Logo','Distributor change'],a:1,e:'Fundamental attributes: investment objective, asset allocation pattern, scheme structure (open/close-ended), fee structure. Changes require notice + 30-day no-load exit.',topic:'DOC'},
      {q:'GST on the management fee is:',o:['Borne by AMC separately','Charged within the TER (investors bear it indirectly)','Exempt','Charged separately to investors'],a:1,e:'GST on management fees is included in the TER cap. Investors bear it indirectly via expenses. Not charged separately.',topic:'NAV'},
      {q:'For a scheme to qualify as Equity-Oriented for tax — minimum equity exposure (computed on quarterly average basis):',o:['51%','60%','65% in domestic equities','75%'],a:2,e:'Equity-oriented for tax: ≥65% in DOMESTIC equities (quarterly average). International funds investing in foreign equity don\'t qualify, despite holding equity.',topic:'TAX'},
      {q:'An International Equity Fund (investing in foreign equity) is taxed as:',o:['Equity-oriented','As per debt/non-equity rules — slab rate or specific (since it lacks 65% domestic equity)','Same as ELSS','Tax-free'],a:1,e:'Domestic-equity threshold (≥65%) is for the favourable equity tax. International funds fail this and are taxed under non-equity rules — typically slab rate post-April 2023.',topic:'TAX'},
      {q:'For a Conservative Hybrid Fund (10-25% equity) — the equity portion is taxed:',o:['As equity (12.5% LTCG)','As debt / non-equity (since equity <65%) — slab rate','Tax-free','At 20% always'],a:1,e:'Conservative Hybrid: equity is only 10-25%, fails the 65% threshold. Whole scheme taxed as debt/non-equity. Slab rate applies (post April 2023 purchases).',topic:'TAX'},
      {q:'A scheme\'s NAV declaration deadline (across the industry) is:',o:['9 PM same day','11 PM same business day on AMFI website','Next morning','24 hours later'],a:1,e:'NAV must be uploaded to AMFI website by 11 PM on the same business day. Liquid funds calculate NAV for every calendar day.',topic:'NAV'},
      {q:'Foreign citizens (non-NRI, non-FPI, non-QFI) — direct investment in Indian mutual funds is:',o:['Permitted','Generally NOT permitted (must route via specific FPI/QFI routes)','Permitted with Aadhaar','Permitted up to ₹50,000'],a:1,e:'Direct foreign citizen investment in Indian MFs is generally not permitted. They must route via FPI registration or QFI scheme.',topic:'OPS'},
      {q:'A "Closet Index Fund" is:',o:['A small index fund','An "active" fund whose holdings closely mirror the benchmark, charging active fees — poor value','A new SEBI category','Same as ETF'],a:1,e:'Closet indexer: charges active fees but actually tracks the index. Low active share, low alpha potential. Investor effectively overpays for passive returns.',topic:'PRF'},
      {q:'The two SEBI-approved debt valuation agencies are:',o:['CRISIL and ICRA','S&P and Moody\'s','SEBI and AMFI','BSE and NSE'],a:0,e:'CRISIL and ICRA are the SEBI-approved valuation agencies for debt securities. Their valuations feed into mutual fund NAV.',topic:'STR'},
      {q:'AMC must disclose top distributor commissions on:',o:['Annual report only','Their website (typically quarterly) — for transparency','SEBI filing only','Never'],a:1,e:'SEBI commission disclosure norms require AMCs to publicly disclose top distributors and commissions paid — quarterly on the website. Promotes transparency.',topic:'REG'},
      {q:'Information Ratio (IR) is calculated as:',o:['Portfolio Return / Risk-Free Return','(Portfolio Return − Tier-1 Benchmark Return) / Standard Deviation of Excess Returns','Sharpe + Treynor','Beta / Standard Deviation'],a:1,e:'IR = (Portfolio Return − Tier-1 Benchmark Return) ÷ Std Dev of Excess Returns. Mandatory daily disclosure on AMC and AMFI websites (SEBI Jan 2025 circular).',topic:'PRF'}
    ]
  },

      {q:'The role of a Mutual Fund Trustee is best described as:',o:['Making investment decisions','Overseeing the AMC and protecting unitholder interests; ensuring compliance with SEBI regulations','Distributing units','Marketing the schemes'],a:1,e:'Trustees are fiduciaries to unitholders. They oversee the AMC, ensure regulatory compliance, approve scheme launches, but DO NOT make investment decisions (AMC does).',topic:'STR'},
      {q:'A scheme with 80% equity and 20% debt is best categorised as:',o:['Conservative Hybrid','Aggressive Hybrid (65-80% equity)','Balanced Hybrid','Equity Savings'],a:1,e:'Aggressive Hybrid: 65-80% equity, 20-35% debt. Taxed as equity-oriented (≥65% equity).',topic:'SCH'},

/* ============================================================
   FULL EXAM POOL — sampler for the 100Q simulation
   Builds a syllabus-weighted, shuffled set from all topic banks.
   ============================================================ */
function samplePool() {
  // pull all questions from non-dynamic sets
  const pool = [];
  TEST_SETS.forEach(s => {
    if (s._dynamic) return;
    s.questions.forEach(q => pool.push(q));
  });
  // group by topic
  const byTopic = {};
  pool.forEach(q => {
    if (!byTopic[q.topic]) byTopic[q.topic] = [];
    byTopic[q.topic].push(q);
  });
  // syllabus weightages summing to 100 (NISM V-A March 2026, mapped to internal topics)
  const targets = { INV: 8, STR: 8, SCH: 6, REG: 16, DOC: 8, NAV: 8, TAX: 4, OPS: 15, RSK: 7, PRF: 20 };
  const out = [];
  Object.entries(targets).forEach(([t, n]) => {
    const bank = (byTopic[t] || []).slice();
    // shuffle
    for (let i = bank.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [bank[i], bank[j]] = [bank[j], bank[i]];
    }
    // take n; if pool is smaller, repeat with re-shuffle
    while (out.filter(q => q.topic === t).length < n) {
      if (!bank.length) {
        // refill from byTopic[t] again
        const refill = (byTopic[t] || []).slice();
        for (let i = refill.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [refill[i], refill[j]] = [refill[j], refill[i]];
        }
        bank.push(...refill);
        if (!bank.length) break;
      }
      out.push(bank.shift());
    }
  });
  // final shuffle so questions don't appear in topic order
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out.slice(0, 100);
}

/* ============================================================
   STATE & STORAGE
   ============================================================ */
let state = {

  currentTest: null
};

/* Hybrid storage with resilient fallback:
   - Tries Claude's window.storage first (when running inside Claude)
   - Falls back to localStorage if window.storage doesn't exist OR throws an error
   - Inside Claude, also writes to localStorage as a backup so refresh-loss is impossible */
const Storage = {
  hasClaude: typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function',
  async get(key) {
    if (this.hasClaude) {
      try {
        const r = await window.storage.get(key);
        if (r && r.value) return r.value;
      } catch(e) { /* fall through to localStorage */ }
    }
    try { return localStorage.getItem(key); } catch(e) { return null; }
  },
  async set(key, value) {
    // Always write to localStorage first — guarantees the data survives Claude storage failures
    try { localStorage.setItem(key, value); } catch(e) { console.error('localStorage.set failed', e); }
    if (this.hasClaude) {
      try { await window.storage.set(key, value); } catch(e) {
        // Claude storage failed — but localStorage already has the data, so we're fine
        if (!this._warnedFallback) {
          console.warn('Claude storage unavailable; using browser localStorage fallback. Export your data via the footer button.');
          this._warnedFallback = true;
        }
      }
    }
  },
  async del(key) {
    try { localStorage.removeItem(key); } catch(e) {}
    if (this.hasClaude) {
      try { await window.storage.delete(key); } catch(e) {}
    }
  }
};

async function loadAll() {
  const userR = await Storage.get('nism:active_user');
  if (userR) state.user = userR;
  for (const u of ['nissar', 'sanjay']) {
    const r = await Storage.get(`nism:attempts:${u}`);
    if (r) {
      try { state.attempts[u] = JSON.parse(r); } catch(e) { state.attempts[u] = []; }
    }
  }
}

async function saveActiveUser() { await Storage.set('nism:active_user', state.user); }

async function saveAttempts() {
  await Storage.set(`nism:attempts:${state.user}`, JSON.stringify(state.attempts[state.user]));
}

async function resetData() {
  if (!confirm(`Reset all attempt data for ${displayName(state.user)}? This cannot be undone.`)) return;
  state.attempts[state.user] = [];
  await Storage.del(`nism:attempts:${state.user}`);
  render();
}

/* Export entire backup (both profiles) as JSON download */
function exportData() {
  const data = {
    version: 1,
    exportedAt: new Date().toISOString(),
    activeUser: state.user,
    attempts: state.attempts
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `nism-tracker-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  // Stamp last export time so the weekly nudge doesn't re-fire
  Storage.set('nism:last_export_at', String(Date.now()));
}

/* Import backup from JSON file. Confirms before overwriting. */
function importData() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.onchange = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      if (!data.attempts || typeof data.attempts !== 'object') throw new Error('Backup file is missing the attempts data');
      const totalCurrent = (state.attempts.nissar?.length || 0) + (state.attempts.sanjay?.length || 0);
      const totalImport = (data.attempts.nissar?.length || 0) + (data.attempts.sanjay?.length || 0);
      if (!confirm(`Import will OVERWRITE current data.\n\nCurrent on this device: ${totalCurrent} attempts\nFile to import: ${totalImport} attempts\n\nProceed?`)) return;
      state.attempts = {
        nissar: Array.isArray(data.attempts.nissar) ? data.attempts.nissar : [],
        sanjay: Array.isArray(data.attempts.sanjay) ? data.attempts.sanjay : []
      };
      if (data.activeUser && (data.activeUser === 'nissar' || data.activeUser === 'sanjay')) {
        state.user = data.activeUser;
      }
      await Storage.set('nism:attempts:nissar', JSON.stringify(state.attempts.nissar));
      await Storage.set('nism:attempts:sanjay', JSON.stringify(state.attempts.sanjay));
      await Storage.set('nism:active_user', state.user);
      document.querySelectorAll('.profile-switch button').forEach(b => {
        b.classList.toggle('active', b.dataset.user === state.user);
      });
      state.page = 'dashboard';
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
      const dashTab = document.querySelector('.nav-tab[data-page="dashboard"]');
      if (dashTab) dashTab.classList.add('active');
      render();
      alert(`Imported ${totalImport} attempts. Storage in use: ${Storage.hasClaude ? 'Claude + localStorage backup' : 'browser localStorage'}.`);
    } catch(err) {
      alert('Import failed: ' + err.message);
    }
  };
  input.click();
}

function displayName(u) { return u.charAt(0).toUpperCase() + u.slice(1); }

/* ============================================================
   ANALYTICS
   ============================================================ */
function getStats(user) {
  const attempts = state.attempts[user] || [];
  if (!attempts.length) return { count: 0, avg: 0, best: 0, passRate: 0, lastDate: null };
  const total = attempts.reduce((s, a) => s + (a.score / a.total) * 100, 0);
  const passes = attempts.filter(a => (a.score / a.total) * 100 >= 50).length;
  const best = Math.max(...attempts.map(a => (a.score / a.total) * 100));
  return {
    count: attempts.length,
    avg: total / attempts.length,
    best: best,
    passRate: (passes / attempts.length) * 100,
    lastDate: attempts[attempts.length - 1].date
  };
}

function getTopicMastery(user) {
  const attempts = state.attempts[user] || [];
  const tally = {};
  Object.keys(TOPICS).forEach(t => { tally[t] = { correct: 0, total: 0 }; });
  attempts.forEach(att => {
    att.questionResults.forEach(qr => {
      if (!tally[qr.topic]) tally[qr.topic] = { correct: 0, total: 0 };
      tally[qr.topic].total++;
      if (qr.correct) tally[qr.topic].correct++;
    });
  });
  return tally;
}

function getLastScoreForSet(user, setId) {
  const attempts = (state.attempts[user] || []).filter(a => a.setId === setId);
  if (!attempts.length) return null;
  const last = attempts[attempts.length - 1];
  return { pct: (last.score / last.total) * 100, score: last.score, total: last.total };
}

                    <span class="chip">${TOPICS[s.topic] || (s._dynamic ? 'Full Syllabus' : 'Mixed')}</span>
                    <span>${s.description}</span>
                    ${allAttempts.length ? `<span>· ${allAttempts.length} attempt${allAttempts.length>1?'s':''}</span>` : ''}
                  </div>
                </div>
                <div class="set-action">
                  ${last ? `<div class="last-score"><b class="${last.pct >= 50 ? 'pass' : 'fail'}">${last.pct.toFixed(0)}%</b><span>last attempt</span></div>` : ''}
                  <button class="btn-start" onclick="event.stopPropagation();startTest('${s.id}')">${last ? 'Retake' : 'Start'}</button>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    </div>
  `;
}

/* ============================================================
   RENDERING — HISTORY
   ============================================================ */
function renderHistory() {
  const attempts = (state.attempts[state.user] || []).slice().reverse();
  const el = document.getElementById('app');
  el.innerHTML = `
    <div class="container">
      <div class="page-header">
        <div>
          <h1>Attempt History</h1>
          <p class="subtitle">${attempts.length} attempt${attempts.length===1?'':'s'} on record</p>
        </div>
      </div>
      <div class="card">
        <div class="card-body">
          ${attempts.length ? attempts.map((a, idx) => {
            const pct = (a.score / a.total) * 100;
            const realIdx = state.attempts[state.user].length - 1 - idx;
            return `
              <div class="attempt-row" onclick="viewReview(${realIdx})" style="padding:14px 20px">
                <div class="attempt-info">
                  <b>${a.setName}</b>
                  <span>${new Date(a.date).toLocaleString('en-IN', {day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'})} · ${Math.floor(a.timeTaken/60)}m ${a.timeTaken%60}s · ${a.attempted}/${a.total} attempted</span>
                </div>
                <div class="attempt-score">
                  <div class="pct ${pct >= 50 ? 'pass' : 'fail'}">${pct.toFixed(0)}%</div>
                  <div class="raw">${a.score}/${a.total}</div>
                </div>
              </div>
            `;
          }).join('') : '<div class="empty">No attempts yet.</div>'}
        </div>
      </div>
    </div>
  `;
}

/* ============================================================
   TEST RUNNER
   ============================================================ */
function startTest(setId) {
  const set = TEST_SETS.find(s => s.id === setId);
  if (!set) return;
  // Dynamic sets (Full 100Q simulator) sample fresh from the pool each attempt
  const questions = set._dynamic ? samplePool() : set.questions;
  state.currentTest = {
    setId: set.id,
    setName: set.name,
    questions: questions,
    answers: new Array(questions.length).fill(null),
    marked: new Array(questions.length).fill(false),
    current: 0,
    timeRemaining: set.duration,
    duration: set.duration,
    startedAt: Date.now()
  };
  state.page = 'test';
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  startTimer();
  renderTest();
}

let timerInterval = null;
function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (!state.currentTest) { clearInterval(timerInterval); return; }
    state.currentTest.timeRemaining--;
    const t = document.getElementById('timer-display');
    if (t) {
      const m = Math.floor(state.currentTest.timeRemaining / 60);
      const s = state.currentTest.timeRemaining % 60;
      t.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      if (state.currentTest.timeRemaining < 60) document.querySelector('.timer').classList.add('danger');
    }
    if (state.currentTest.timeRemaining <= 0) {
      clearInterval(timerInterval);
      submitTest(true);
    }
  }, 1000);
}

function renderTest() {
  const t = state.currentTest;
  if (!t) return;
  const q = t.questions[t.current];
  const m = Math.floor(t.timeRemaining / 60);
  const s = t.timeRemaining % 60;

  const el = document.getElementById('app');
  el.innerHTML = `
    <div class="exam-header">
      <div class="exam-title">${t.setName} — NISM V-A Practice Mode</div>
      <div class="exam-right">
        <div class="timer ${t.timeRemaining < 60 ? 'danger' : ''}">
          <span class="clock">⏱</span>
          <span id="timer-display">${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}</span>
        </div>
        <button class="btn-end" onclick="confirmSubmit()">End Test</button>
      </div>
    </div>
    <div class="exam-body">
      <div class="palette-card">
        <h4>Questions</h4>
        <div class="legend">
          <div class="legend-item"><span class="legend-box selected"></span>Selected</div>
          <div class="legend-item"><span class="legend-box answered"></span>Answered</div>
          <div class="legend-item"><span class="legend-box review"></span>Mark For Review</div>
          <div class="legend-item"><span class="legend-box notattempted"></span>Not Attempted</div>
        </div>
        <div class="palette-grid">
          ${t.questions.map((_, i) => {
            let cls = '';
            if (t.answers[i] !== null) cls += ' answered';
            if (t.marked[i]) cls += ' review';
            if (i === t.current) cls += ' current';
            return `<button class="palette-btn${cls}" onclick="goToQ(${i})">${i+1}</button>`;
          }).join('')}
        </div>
      </div>
      <div class="question-card">
        <div class="q-tag-row">
          <div class="q-tag">Q ${t.current + 1}/${t.questions.length}</div>
          <div class="q-mark">Mark: <b>1</b></div>
        </div>
        <div class="q-body">
          <div class="q-text">${q.q}</div>
          <div class="q-options">
            ${q.o.map((opt, i) => `
              <div class="q-option ${t.answers[t.current] === i ? 'selected' : ''}" onclick="selectOption(${i})">
                <div class="radio"></div>
                <div>${String.fromCharCode(97+i)}. ${opt}</div>
              </div>
            `).join('')}
          </div>
        </div>
        <div class="q-foot">
          <div class="q-foot-left">
            <label class="review-toggle">
              <input type="checkbox" ${t.marked[t.current] ? 'checked' : ''} onchange="toggleMark()">
              Mark for Review
            </label>
            <button class="clear-btn" onclick="clearAnswer()">CLEAR ANSWER</button>
          </div>
          <div class="nav-buttons">
            <button class="btn-secondary" ${t.current === 0 ? 'disabled' : ''} onclick="prevQ()">Previous</button>
            <button class="btn-primary" onclick="nextQ()">${t.current === t.questions.length - 1 ? 'Submit' : 'Next'}</button>
          </div>
        </div>
      </div>
    </div>
  `;
}

function selectOption(i) {
  state.currentTest.answers[state.currentTest.current] = i;
  renderTest();
}
function toggleMark() {
  state.currentTest.marked[state.currentTest.current] = !state.currentTest.marked[state.currentTest.current];
  renderTest();
}
function clearAnswer() {
  state.currentTest.answers[state.currentTest.current] = null;
  renderTest();
}
function goToQ(i) {
  state.currentTest.current = i;
  renderTest();
}
function prevQ() {
  if (state.currentTest.current > 0) { state.currentTest.current--; renderTest(); }
}
function nextQ() {
  const t = state.currentTest;
  if (t.current === t.questions.length - 1) { confirmSubmit(); }
  else { t.current++; renderTest(); }
}

function confirmSubmit() {
  const t = state.currentTest;
  const attempted = t.answers.filter(a => a !== null).length;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>End test?</h3>
      <p>You attempted <b>${attempted}</b> of <b>${t.questions.length}</b> questions.</p>
      <p>Marked for review: <b>${t.marked.filter(m => m).length}</b></p>
      <p style="margin-top:12px;color:#9ca3af;font-size:12px">Once submitted, you'll see your score and the answer key.</p>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="this.closest('.modal-overlay').remove()">Go Back</button>
        <button class="btn-primary" onclick="submitTest()">Submit Test</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
}

function submitTest(timeUp = false) {
  const t = state.currentTest;
  if (!t) return;
  clearInterval(timerInterval);
  document.querySelectorAll('.modal-overlay').forEach(o => o.remove());

  let score = 0;
  const questionResults = t.questions.map((q, i) => {
    const correct = t.answers[i] === q.a;
    if (correct) score++;
    return {
      q: q.q,
      options: q.o,
      correctAnswer: q.a,
      userAnswer: t.answers[i],
      correct,
      explanation: q.e,
      topic: q.topic
    };
  });

  const attempt = {
    setId: t.setId,
    setName: t.setName,
    date: new Date().toISOString(),
    score,
    total: t.questions.length,
    attempted: t.answers.filter(a => a !== null).length,
    timeTaken: t.duration - t.timeRemaining,
    questionResults,
    timeUp
  };

  state.attempts[state.user].push(attempt);
  saveAttempts();

  state.page = 'result';
  state.currentResultIdx = state.attempts[state.user].length - 1;
  state.currentTest = null;
  renderResult();
}

/* ============================================================
   RESULT & REVIEW
   ============================================================ */
function renderResult() {
  const att = state.attempts[state.user][state.currentResultIdx];
  if (!att) return;
  const pct = (att.score / att.total) * 100;
  const passed = pct >= 50;
  const incorrect = att.questionResults.filter(r => r.userAnswer !== null && !r.correct).length;
  const skipped = att.questionResults.filter(r => r.userAnswer === null).length;
  const m = Math.floor(att.timeTaken / 60);
  const s = att.timeTaken % 60;

  // topic breakdown for this attempt
  const topicTally = {};
  att.questionResults.forEach(r => {
    if (!topicTally[r.topic]) topicTally[r.topic] = { correct: 0, total: 0 };
    topicTally[r.topic].total++;
    if (r.correct) topicTally[r.topic].correct++;
  });

  const el = document.getElementById('app');
  el.innerHTML = `
    <div class="container">
      <div class="result-card">
        <div class="result-head">
          <div class="result-name">
            <div class="result-avatar">${displayName(state.user).charAt(0)}</div>
            <div>
              <h2>${displayName(state.user)}</h2>
              <p>${att.setName}</p>
            </div>
          </div>
          <div class="result-status ${passed ? 'pass' : 'fail'}">${passed ? 'PASS' : 'FAIL'}</div>
        </div>
        <div class="result-meta">
          <div class="result-meta-item">
            <div class="lbl">Date</div>
            <div class="val">${new Date(att.date).toLocaleDateString('en-IN', {day:'numeric',month:'short',year:'numeric'})}</div>
          </div>
          <div class="result-meta-item">
            <div class="lbl">Score</div>
            <div class="val big">${att.score}/${att.total}</div>
          </div>
          <div class="result-meta-item">
            <div class="lbl">Percentage</div>
            <div class="val big ${passed ? 'green' : 'red'}">${pct.toFixed(1)}%</div>
          </div>
          <div class="result-meta-item">
            <div class="lbl">Pass mark</div>
            <div class="val">50%</div>
          </div>
          <div class="result-meta-item">
            <div class="lbl">Time taken</div>
            <div class="val">${m}m ${s}s</div>
          </div>
          <div class="result-meta-item">
            <div class="lbl">Attempted</div>
            <div class="val">${att.attempted}/${att.total}</div>
          </div>
        </div>
        <div class="result-actions">
          <button class="btn-secondary" onclick="state.page='dashboard';render()">Back to Dashboard</button>
          <button class="btn-primary" onclick="startTest('${att.setId}')">Retake This Set</button>
        </div>
      </div>

      <div class="card" style="margin-bottom:24px">
        <div class="card-head"><h3>Topic breakdown — this attempt</h3></div>
        <div class="card-body">
          ${Object.entries(topicTally).map(([code, t]) => {
            const p = (t.correct / t.total) * 100;
            const cls = p < 50 ? 'weak' : p < 75 ? 'ok' : 'strong';
            const color = p < 50 ? '#ef4444' : p < 75 ? '#f59e0b' : '#10b981';
            return `
              <div class="topic-row">
                <div class="topic-head">
                  <span class="topic-name">${TOPICS[code] || code}</span>
                  <span class="topic-pct ${cls}">${t.correct}/${t.total} · ${p.toFixed(0)}%</span>
                </div>
                <div class="topic-bar"><div class="topic-bar-fill" style="width:${p}%;background:${color}"></div></div>
              </div>
            `;
          }).join('')}
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <h3>Answer Key & Explanations</h3>
          <span class="meta">${att.score} correct · ${incorrect} incorrect · ${skipped} skipped</span>
        </div>
        <div class="filter-row" style="padding:12px 20px;border-bottom:1px solid #f3f4f6;margin-bottom:0">
          <span class="filter-chip active" onclick="filterReview('all', this)">All (${att.total})</span>
          <span class="filter-chip" onclick="filterReview('wrong', this)">Wrong only (${incorrect})</span>
          <span class="filter-chip" onclick="filterReview('skipped', this)">Skipped (${skipped})</span>
        </div>
        <div class="card-body" id="review-list">
          ${renderReviewList(att, 'all')}
        </div>
      </div>
    </div>
  `;
}

function renderReviewList(att, filter) {
  return att.questionResults.map((r, i) => {
    const isWrong = r.userAnswer !== null && !r.correct;
    const isSkipped = r.userAnswer === null;
    if (filter === 'wrong' && !isWrong) return '';
    if (filter === 'skipped' && !isSkipped) return '';
    const userTxt = r.userAnswer !== null ? r.options[r.userAnswer] : 'Not answered';
    const correctTxt = r.options[r.correctAnswer];
    return `
      <div class="review-q">
        <div class="review-q-head">
          <span class="review-q-num">Q${i+1}</span>
          <span class="review-q-tag">${TOPICS[r.topic] || r.topic}</span>
        </div>
        <div class="review-q-text">${r.q}</div>
        <div class="review-q-row">
          <span class="lbl">Your answer:</span>
          <span class="ans ${r.correct ? 'correct' : (isSkipped ? 'skipped' : 'wrong')}">${userTxt}</span>
        </div>
        <div class="review-q-row">
          <span class="lbl">Correct answer:</span>
          <span class="ans correct">${correctTxt}</span>
        </div>
        <div class="review-explain">${r.explanation}</div>
      </div>
    `;
  }).join('') || '<div class="empty">Nothing matches this filter.</div>';
}

function filterReview(filter, chip) {
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  const att = state.attempts[state.user][state.currentResultIdx];
  document.getElementById('review-list').innerHTML = renderReviewList(att, filter);
}

function viewReview(idx) {
  state.currentResultIdx = idx;
  state.page = 'result';
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  renderResult();
}

/* ============================================================
   ROUTER
   ============================================================ */
function render() {
  if (state.page === 'dashboard') renderDashboard();
  else if (state.page === 'tests') renderTests();
  else if (state.page === 'history') renderHistory();
  else if (state.page === 'test') renderTest();
  else if (state.page === 'result') renderResult();
}

document.querySelectorAll('.nav-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    if (state.page === 'test') {
      if (!confirm('Test in progress. Leave and lose progress?')) return;
      clearInterval(timerInterval);
      state.currentTest = null;
    }
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    state.page = tab.dataset.page;
    render();
  });
});

document.querySelectorAll('.profile-switch button').forEach(b => {
  b.addEventListener('click', () => {
    if (state.page === 'test') {
      if (!confirm('Test in progress. Switch profiles and lose progress?')) return;
      clearInterval(timerInterval);
      state.currentTest = null;
    }
    document.querySelectorAll('.profile-switch button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    state.user = b.dataset.user;
    saveActiveUser();
    state.page = 'dashboard';
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    document.querySelector('.nav-tab[data-page="dashboard"]').classList.add('active');
    render();
  });
});

/* Weekly auto-backup nudge: if 7+ days since last export AND there's meaningful data,
   offer a one-click backup download. User can dismiss; nag at most once per session. */
async function maybeNudgeBackup() {
  try {
    const totalAttempts = (state.attempts.nissar?.length || 0) + (state.attempts.sanjay?.length || 0);
    if (totalAttempts < 3) return; // not worth nagging until there's real data
    const lastExportRaw = await Storage.get('nism:last_export_at');
    const now = Date.now();
    const lastExport = lastExportRaw ? parseInt(lastExportRaw, 10) : 0;
    const daysSince = lastExport ? (now - lastExport) / (1000 * 60 * 60 * 24) : 999;
    if (daysSince < 7) return;
    // Wait a moment so the dashboard renders first, then nudge
    setTimeout(() => {
      const msg = `Quick backup reminder\n\nYou have ${totalAttempts} attempts logged across both profiles.\nLast backup: ${lastExport ? Math.floor(daysSince) + ' days ago' : 'never'}.\n\nDownload a backup JSON now? (Recommended weekly.)`;
      if (confirm(msg)) {
        exportData();
      } else {
        // Snooze for 24h so we don't nag again today
        Storage.set('nism:last_export_at', String(now - 6 * 24 * 60 * 60 * 1000));
      }
    }, 1500);
  } catch(e) { /* silent — backup nudge is best-effort */ }
}

/* ============================================================
   INIT
   ============================================================ */
(async function init() {
  await loadAll();
  // sync profile UI to loaded user
  document.querySelectorAll('.profile-switch button').forEach(b => {
    b.classList.toggle('active', b.dataset.user === state.user);
  });
  render();
  maybeNudgeBackup();
})();

</script>
