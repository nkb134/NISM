<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NISM V-A Practice Tracker — Optimize</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;background:#f4f6f9;color:#1a1f3a;font-size:14px;line-height:1.5}
  .hidden{display:none !important}

  /* Top nav (NISM-style) */
  .nav{background:#fff;border-bottom:1px solid #e5e7eb;padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:64px;position:sticky;top:0;z-index:50}
  .nav-brand{display:flex;align-items:center;gap:12px;font-weight:700}
  .nav-brand .logo{width:36px;height:36px;background:linear-gradient(135deg,#1a1f3a,#3b3f6e);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#a3e635;font-weight:800;font-size:13px}
  .nav-brand .title{font-size:14px;letter-spacing:.2px}
  .nav-brand .sub{font-size:11px;color:#6b7280;font-weight:500}
  .nav-tabs{display:flex;gap:32px;align-items:center}
  .nav-tab{padding:10px 0;color:#4b5563;cursor:pointer;font-weight:500;border-bottom:2px solid transparent;transition:all .15s}
  .nav-tab:hover{color:#1a1f3a}
  .nav-tab.active{color:#1a1f3a;border-bottom-color:#1a1f3a;font-weight:600}
  .nav-right{display:flex;align-items:center;gap:16px}
  .profile-switch{display:flex;background:#f4f6f9;border-radius:8px;padding:3px;gap:2px}
  .profile-switch button{border:none;background:transparent;padding:6px 14px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;color:#6b7280}
  .profile-switch button.active{background:#1a1f3a;color:#fff}

  /* Main container */
  .container{max-width:1280px;margin:0 auto;padding:32px}

  /* Dashboard */
  .page-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px}
  .page-header h1{font-size:24px;font-weight:700}
  .page-header p{color:#6b7280;font-size:13px;margin-top:4px}
  .page-header .subtitle{color:#6b7280;font-size:13px}

  .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:32px}
  .stat-card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:18px}
  .stat-label{color:#6b7280;font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
  .stat-value{font-size:26px;font-weight:700;color:#1a1f3a}
  .stat-sub{font-size:11px;color:#6b7280;margin-top:4px}
  .stat-card.pass .stat-value{color:#10b981}
  .stat-card.fail .stat-value{color:#ef4444}

  .grid-main{display:grid;grid-template-columns:1.4fr 1fr;gap:24px}

  .card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;overflow:hidden}
  .card-head{padding:16px 20px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center}
  .card-head h3{font-size:14px;font-weight:600;color:#1a1f3a}
  .card-head .meta{font-size:11px;color:#6b7280}
  .card-body{padding:8px 0}

  /* Test set list */
  .set-row{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid #f3f4f6;cursor:pointer;transition:background .15s}
  .set-row:hover{background:#fafbfd}
  .set-row:last-child{border-bottom:none}
  .set-row.featured{background:linear-gradient(180deg,#fafbfd 0%,#fff 100%);border-left:3px solid #a3e635;padding:18px 20px}
  .set-row.featured:hover{background:#f8faff}
  .set-row.featured .set-title{font-weight:700;font-size:14px}
  .set-row.featured .set-title::after{content:'EXAM';margin-left:8px;font-size:9px;background:#1a1f3a;color:#a3e635;padding:2px 6px;border-radius:3px;letter-spacing:.6px;font-weight:700;vertical-align:middle}
  .set-info{flex:1}
  .set-title{font-weight:600;font-size:13px;margin-bottom:3px}
  .set-meta{font-size:11px;color:#6b7280;display:flex;gap:10px;flex-wrap:wrap}
  .set-meta .chip{background:#f4f6f9;padding:2px 7px;border-radius:4px;font-weight:500}
  .set-action{display:flex;align-items:center;gap:10px}
  .last-score{font-size:11px;color:#6b7280;text-align:right}
  .last-score b{display:block;font-size:14px;color:#1a1f3a;font-weight:600}
  .last-score .pass{color:#10b981}
  .last-score .fail{color:#ef4444}
  .btn-start{background:#1a1f3a;color:#fff;border:none;padding:8px 16px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;transition:background .15s}
  .btn-start:hover{background:#2a2f5a}

  /* Topic mastery */
  .topic-row{padding:12px 20px;border-bottom:1px solid #f3f4f6}
  .topic-row:last-child{border-bottom:none}
  .topic-head{display:flex;justify-content:space-between;margin-bottom:6px;font-size:12px}
  .topic-name{font-weight:600;color:#1a1f3a}
  .topic-pct{font-weight:700}
  .topic-pct.weak{color:#ef4444}
  .topic-pct.ok{color:#f59e0b}
  .topic-pct.strong{color:#10b981}
  .topic-pct.untested{color:#9ca3af;font-weight:500}
  .topic-bar{height:6px;background:#f3f4f6;border-radius:3px;overflow:hidden}
  .topic-bar-fill{height:100%;border-radius:3px;transition:width .3s}
  .topic-meta{font-size:10px;color:#9ca3af;margin-top:4px}
  .practice-link{color:#1a1f3a;font-weight:600;cursor:pointer;text-decoration:none;border-bottom:1px solid #e5e7eb;padding-bottom:1px;transition:border-color .15s}
  .practice-link:hover{border-bottom-color:#1a1f3a}

  /* Attempts */
  .attempt-row{display:flex;justify-content:space-between;align-items:center;padding:11px 20px;border-bottom:1px solid #f3f4f6;font-size:12px}
  .attempt-row:last-child{border-bottom:none}
  .attempt-row:hover{background:#fafbfd;cursor:pointer}
  .attempt-info b{display:block;font-weight:600;color:#1a1f3a;margin-bottom:2px}
  .attempt-info span{color:#6b7280;font-size:11px}
  .attempt-score{text-align:right}
  .attempt-score .pct{font-weight:700;font-size:14px}
  .attempt-score .pct.pass{color:#10b981}
  .attempt-score .pct.fail{color:#ef4444}
  .attempt-score .raw{font-size:10px;color:#6b7280}
  .empty{padding:32px 20px;text-align:center;color:#9ca3af;font-size:13px}

  /* Test runner — NISM replica */
  .exam-header{position:sticky;top:0;background:#fff;border-bottom:1px solid #e5e7eb;padding:18px 32px;display:flex;justify-content:space-between;align-items:center;z-index:10}
  .exam-title{font-size:14px;font-weight:600;color:#1a1f3a;flex:1;max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .exam-right{display:flex;align-items:center;gap:20px}
  .timer{font-size:18px;font-weight:600;color:#1a1f3a;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px}
  .timer.danger{color:#ef4444}
  .timer .clock{font-size:18px}
  .btn-end{background:#1a1f3a;color:#fff;border:none;padding:10px 22px;border-radius:8px;font-weight:600;cursor:pointer;font-size:13px}
  .btn-end:hover{background:#2a2f5a}

  .exam-body{display:grid;grid-template-columns:280px 1fr;gap:24px;max-width:1280px;margin:24px auto;padding:0 32px}

  /* Question palette */
  .palette-card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:16px;align-self:start;position:sticky;top:104px}
  .palette-card h4{font-size:13px;font-weight:600;margin-bottom:12px}
  .legend{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;font-size:11px}
  .legend-item{display:flex;align-items:center;gap:6px;color:#4b5563}
  .legend-box{width:14px;height:14px;border-radius:3px;border:1.5px solid #d1d5db}
  .legend-box.selected{background:#fff;border-color:#1a1f3a}
  .legend-box.answered{background:#10b981;border-color:#10b981}
  .legend-box.review{background:#ef4444;border-color:#ef4444}
  .legend-box.notattempted{background:#e5e7eb;border-color:#e5e7eb}
  .palette-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .palette-btn{aspect-ratio:1;border:1.5px solid #e5e7eb;background:#fff;border-radius:5px;cursor:pointer;font-size:12px;font-weight:600;color:#4b5563;transition:all .1s}
  .palette-btn:hover{border-color:#1a1f3a}
  .palette-btn.answered{background:#10b981;color:#fff;border-color:#10b981}
  .palette-btn.review{background:#ef4444;color:#fff;border-color:#ef4444}
  .palette-btn.review.answered{background:linear-gradient(135deg,#ef4444 50%,#10b981 50%)}
  .palette-btn.current{outline:2px solid #1a1f3a;outline-offset:2px}

  /* Question card */
  .question-card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;overflow:hidden}
  .q-tag-row{display:flex;align-items:flex-start;justify-content:space-between;padding:0;border-bottom:1px solid #e5e7eb}
  .q-tag{background:#10b981;color:#fff;padding:14px 28px 14px 24px;font-weight:700;font-size:13px;border-radius:0 0 16px 0;clip-path:polygon(0 0,100% 0,90% 100%,0 100%)}
  .q-mark{padding:14px 24px;font-size:13px;color:#6b7280}
  .q-mark b{color:#1a1f3a}
  .q-body{padding:24px}
  .q-text{font-size:15px;font-weight:600;color:#1a1f3a;margin-bottom:20px;line-height:1.6}
  .q-options{display:flex;flex-direction:column;gap:10px}
  .q-option{padding:14px 18px;border:1px solid #e5e7eb;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:all .15s;font-size:13px}
  .q-option:hover{border-color:#9ca3af;background:#fafbfd}
  .q-option.selected{border-color:#1a1f3a;background:#f0f4ff}
  .q-option .radio{width:18px;height:18px;border:1.5px solid #d1d5db;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#fff}
  .q-option.selected .radio{border-color:#1a1f3a}
  .q-option.selected .radio::after{content:'';width:10px;height:10px;background:#1a1f3a;border-radius:50%}
  .q-foot{padding:16px 24px;border-top:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;background:#fafbfd}
  .q-foot-left{display:flex;align-items:center;gap:24px}
  .review-toggle{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:#4b5563}
  .review-toggle input{width:16px;height:16px;cursor:pointer}
  .clear-btn{background:none;border:none;color:#1a1f3a;font-weight:600;font-size:12px;cursor:pointer;letter-spacing:.5px}
  .nav-buttons{display:flex;gap:10px}
  .btn-secondary{background:#fff;color:#1a1f3a;border:1px solid #1a1f3a;padding:9px 22px;border-radius:6px;font-weight:600;cursor:pointer;font-size:13px}
  .btn-secondary:disabled{opacity:.4;cursor:not-allowed}
  .btn-primary{background:#1a1f3a;color:#fff;border:none;padding:10px 24px;border-radius:6px;font-weight:600;cursor:pointer;font-size:13px}
  .btn-primary:hover{background:#2a2f5a}

  /* Modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:100}
  .modal{background:#fff;border-radius:10px;padding:28px;max-width:480px;width:90%}
  .modal h3{font-size:18px;font-weight:700;margin-bottom:14px}
  .modal p{color:#4b5563;font-size:13px;line-height:1.7;margin-bottom:8px}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}

  /* Result */
  .result-card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:28px;margin-bottom:24px}
  .result-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid #e5e7eb;padding-bottom:24px;margin-bottom:24px}
  .result-name{display:flex;align-items:center;gap:14px}
  .result-avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#1a1f3a,#3b3f6e);color:#a3e635;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}
  .result-name h2{font-size:18px;font-weight:700}
  .result-name p{color:#6b7280;font-size:12px;margin-top:2px}
  .result-status{font-size:24px;font-weight:800;letter-spacing:1px}
  .result-status.pass{color:#10b981}
  .result-status.fail{color:#ef4444}
  .result-meta{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;font-size:11px}
  .result-meta-item .lbl{color:#6b7280;margin-bottom:3px}
  .result-meta-item .val{font-size:14px;font-weight:600;color:#1a1f3a}
  .result-meta-item .val.big{font-size:20px;font-weight:700}
  .result-meta-item .val.green{color:#10b981}
  .result-meta-item .val.red{color:#ef4444}

  .result-actions{display:flex;gap:10px;margin-top:24px}

  /* Review */
  .review-q{padding:18px 24px;border-bottom:1px solid #f3f4f6}
  .review-q:last-child{border-bottom:none}
  .review-q-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
  .review-q-num{font-weight:700;font-size:13px}
  .review-q-tag{font-size:10px;background:#f4f6f9;color:#6b7280;padding:3px 8px;border-radius:4px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
  .review-q-text{font-weight:600;margin-bottom:12px;font-size:13px}
  .review-q-row{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:6px}
  .review-q-row .lbl{color:#6b7280;min-width:120px}
  .review-q-row .ans.correct{color:#10b981;font-weight:600}
  .review-q-row .ans.wrong{color:#ef4444;font-weight:600;text-decoration:line-through}
  .review-q-row .ans.skipped{color:#9ca3af;font-style:italic}
  .review-explain{margin-top:10px;padding:10px 14px;background:#fafbfd;border-left:3px solid #a3e635;font-size:12px;color:#4b5563;border-radius:0 4px 4px 0;line-height:1.6}

  /* Filters */
  .filter-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .filter-chip{padding:6px 14px;border:1px solid #e5e7eb;border-radius:20px;cursor:pointer;font-size:12px;font-weight:500;background:#fff;color:#4b5563}
  .filter-chip:hover{border-color:#1a1f3a}
  .filter-chip.active{background:#1a1f3a;color:#fff;border-color:#1a1f3a}

  /* Footer */
  .footer{padding:20px 32px;font-size:11px;color:#9ca3af;display:flex;justify-content:space-between;border-top:1px solid #e5e7eb;background:#fff;margin-top:48px}
  .footer .danger-link{color:#ef4444;cursor:pointer;font-weight:500}
  .footer .util-link{color:#1a1f3a;cursor:pointer;font-weight:500;margin-right:14px}
  .footer .util-link:hover{text-decoration:underline}

  @media(max-width:768px){
    .nav{padding:0 16px;flex-wrap:wrap;height:auto}
    .nav-tabs{order:3;width:100%;border-top:1px solid #e5e7eb;padding:8px 0;gap:20px;overflow-x:auto}
    .container{padding:16px}
    .stats-row{grid-template-columns:repeat(2,1fr)}
    .grid-main{grid-template-columns:1fr}
    .exam-body{grid-template-columns:1fr;padding:0 16px}
    .palette-card{position:static}
    .result-meta{grid-template-columns:repeat(3,1fr)}
  }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-brand">
    <div class="logo">N</div>
    <div>
      <div class="title">NISM V-A Practice Tracker</div>
      <div class="sub">Optimize · Founder Prep</div>
    </div>
  </div>
  <div class="nav-tabs">
    <div class="nav-tab active" data-page="dashboard">Dashboard</div>
    <div class="nav-tab" data-page="tests">Practice Sets</div>
    <div class="nav-tab" data-page="history">Attempts</div>
  </div>
  <div class="nav-right">
    <div class="profile-switch">
      <button data-user="nissar" class="active">Nissar</button>
      <button data-user="sanjay">Sanjay</button>
    </div>
  </div>
</nav>

<div id="app"></div>

<div class="footer">
  <div>NISM V-A — 100Q · 120 min · 50% pass · No negative marking</div>
  <div>
    <span class="util-link" onclick="exportData()">⬇ Export backup</span>
    <span class="util-link" onclick="importData()">⬆ Import backup</span>
    <span class="danger-link" onclick="resetData()">Reset this profile's data</span>
  </div>
</div>

<script>
/* ============================================================
   QUESTION BANK — keyed to NISM V-A March 2026 syllabus
   Topic codes:
   INV (Ch1 Investment Landscape), STR (Ch2-3 MF Concept & Structure),
   REG (Ch4 Legal/Regulatory + Ch6 Distribution), DOC (Ch5 Scheme Documents),
   NAV (Ch7 NAV/TER/Pricing), TAX (Ch8 Taxation),
   OPS (Ch9 Investor Services), RSK (Ch10 Risk/Return),
   PRF (Ch11-12 Performance & Selection), SCH (Ch2 + Ch5 scheme categories)
   ============================================================ */
const TOPICS = {
  INV: 'Investment Landscape',
  STR: 'MF Structure & Concepts',
  REG: 'Regulatory & Distribution',
  DOC: 'Scheme Documents (SID/SAI/KIM)',
  SCH: 'Scheme Types & Categories',
  NAV: 'NAV, TER & Pricing',
  TAX: 'Taxation',
  OPS: 'Investor Services & Operations',
  RSK: 'Risk, Return & Risk Measures',
  PRF: 'Benchmarks & Scheme Selection'
};

// Syllabus weightages (NISM V-A March 2026, mapped to internal topics; sums to 100)
const SYLLABUS_WEIGHTAGE = {
  INV: 8, STR: 8, SCH: 6, REG: 16, DOC: 8, NAV: 8, TAX: 4, OPS: 15, RSK: 7, PRF: 20
};

// Map each topic to its primary practice set (for "Practice →" links from Topic Mastery)
const TOPIC_TO_SET = {
  INV: 'set_inv',
  STR: 'set_str',
  SCH: 'set_sch',
  REG: 'set_reg',
  DOC: 'set_doc',
  NAV: 'set_nav',
  TAX: 'set_tax',
  OPS: 'set_ops',
  RSK: 'set_rsk',
  PRF: 'set_prf'
};

const TEST_SETS = [
  {
    id: 'set_str',
    name: 'Set 1 — MF Structure & Concepts',
    topic: 'STR',
    duration: 1200, // 20 min
    description: 'Trust structure, Sponsor, Trustee, AMC, Custodian roles',
    questions: [
      {q:'Mutual funds in India are constituted as:',o:['Companies under Companies Act 2013','Trusts under Indian Trusts Act 1882','Partnerships under Partnership Act','Co-operatives under Co-op Societies Act'],a:1,e:'Mutual funds in India are set up as Trusts under the Indian Trusts Act, 1882. Unitholders are the beneficiaries of the trust.',topic:'STR'},
      {q:'Mutual funds are constituted as Trusts in India. Who are the beneficiaries of the trust?',o:['Employees of the AMC','Mutual fund distributors','Unitholders','Trustees of the mutual fund'],a:2,e:'Unitholders are the beneficial owners of the trust property. The trustees hold the property in trust for the unitholders.',topic:'STR'},
      {q:'The minimum net worth required for an Asset Management Company (AMC) is:',o:['₹10 crore','₹25 crore','₹50 crore','₹100 crore'],a:2,e:'SEBI mandates a minimum net worth of ₹50 crore for AMCs at all times.',topic:'STR'},
      {q:'The sponsor of a mutual fund must contribute at least __ to the net worth of the AMC.',o:['10%','25%','40%','51%'],a:2,e:'The sponsor must contribute a minimum of 40% to the net worth of the AMC.',topic:'STR'},
      {q:'A sponsor must have a sound track record in financial services for at least:',o:['2 years','3 years','5 years','10 years'],a:2,e:'Sponsors must have a minimum 5-year track record in financial services and demonstrated financial soundness.',topic:'STR'},
      {q:'What proportion of the Board of Trustees must be independent?',o:['1/2','2/3','3/4','All'],a:1,e:'At least 2/3rd of the trustees must be independent — not associated with the sponsor.',topic:'STR'},
      {q:'The role of the Custodian in a mutual fund is to:',o:['Manage the investments','Hold the securities of the scheme in safe custody','Distribute units to investors','Approve scheme launches'],a:1,e:'The custodian holds securities and other assets of the scheme in safe custody. They are SEBI-registered and independent of the AMC.',topic:'STR'},
      {q:'Registrar and Transfer Agents (RTA) primarily handle:',o:['Investment decisions','Fund accounting','Investor records, transactions, and unit allotment','Marketing the scheme'],a:2,e:'RTAs maintain investor records, process applications, allot units, handle redemptions, and dispatch account statements.',topic:'STR'},
      {q:'Who appoints the Asset Management Company (AMC)?',o:['SEBI','The sponsor','The trustees','AMFI'],a:2,e:'Trustees appoint the AMC, with prior approval from SEBI. AMC operates under the trust deed and IMA (Investment Management Agreement).',topic:'STR'},
      {q:'AMFI is best described as:',o:['A statutory regulator','An industry body of mutual funds','A government department','A stock exchange'],a:1,e:'AMFI (Association of Mutual Funds in India) is the industry body — not a regulator. SEBI is the statutory regulator.',topic:'STR'},
      {q:'Which of the following is NOT a function of the Trustees?',o:['Ensuring AMC compliance with SEBI regulations','Approving scheme launches','Making day-to-day investment decisions','Reviewing AMC performance quarterly'],a:2,e:'Trustees oversee — they do NOT make investment decisions. The AMC handles day-to-day fund management.',topic:'STR'},
      {q:'Mutual funds in India are regulated primarily by:',o:['RBI','SEBI','IRDAI','MCA'],a:1,e:'SEBI is the primary regulator under SEBI (Mutual Funds) Regulations, 1996.',topic:'STR'}
    ]
  },
  {
    id: 'set_nav',
    name: 'Set 2 — NAV, TER & Pricing',
    topic: 'NAV',
    duration: 1200,
    description: 'NAV calculation, cut-off times, expense ratios, applicable NAV',
    questions: [
      {q:'The cut-off time for an equity fund subscription with applicable NAV of the same day is:',o:['12:00 PM','1:30 PM','3:00 PM','4:00 PM'],a:2,e:'For equity-oriented schemes, the cut-off time is 3:00 PM. Applications received before 3 PM with funds available get same-day NAV.',topic:'NAV'},
      {q:'The cut-off time for liquid fund subscriptions is:',o:['12:00 PM','1:30 PM','3:00 PM','4:00 PM'],a:1,e:'Liquid fund subscription cut-off is 1:30 PM. This is to align with banking hours and same-day deployment.',topic:'NAV'},
      {q:'For applicable NAV in liquid funds, in addition to the cut-off, what other condition must be met?',o:['Investor must be KYC compliant','Funds must be realized in scheme account before cut-off','Distributor must be empanelled','Application must be submitted online'],a:1,e:'Funds must be CREDITED to the scheme account before cut-off — not just application receipt. This applies to all subscriptions (post-2020 SEBI rule).',topic:'NAV'},
      {q:'For equity schemes, the maximum Total Expense Ratio (TER) on the first ₹500 crore of AUM is:',o:['1.50%','1.75%','2.00%','2.25%'],a:3,e:'For equity schemes, TER on the first ₹500 cr is 2.25%. Subsequent slabs reduce gradually with higher AUM.',topic:'NAV'},
      {q:'TER for direct plans is __ regular plans.',o:['Higher than','Same as','Lower than','Twice'],a:2,e:'Direct plans have lower TER because they exclude distributor commission, leading to higher returns over time.',topic:'NAV'},
      {q:'NAV of a mutual fund scheme is calculated as:',o:['Total assets / number of units','(Total assets − Total liabilities) / number of units','Total income / number of units','Market price of best holding'],a:1,e:'NAV = (Net Assets) / Outstanding Units, where Net Assets = Total assets − Total liabilities (including expenses payable).',topic:'NAV'},
      {q:'NAV must be published by the AMC:',o:['Weekly','On every business day','Monthly','When the fund manager decides'],a:1,e:'AMCs must declare NAV every business day on AMFI website by 11 PM (and on their own website).',topic:'NAV'},
      {q:'Exit load collected by a mutual fund is:',o:['Retained by the AMC as fee income','Credited back to the scheme','Paid to SEBI','Paid to the distributor'],a:1,e:'Exit load is credited to the scheme — it benefits remaining unitholders, not the AMC.',topic:'NAV'},
      {q:'TER includes which of the following?',o:['Brokerage and STT only','Management fees, marketing, custodian, RTA, audit fees','Only fund manager salary','Distribution commission only'],a:1,e:'TER covers all recurring scheme expenses — management fees, custodian, RTA, marketing, audit, trustee fees, etc. Brokerage/STT are excluded from TER limit.',topic:'NAV'},
      {q:'Mutual funds are allowed to charge differential exit loads based on the amount of investment.',o:['True','False'],a:1,e:'Differential exit loads based on investment amount are NOT allowed. Exit load must be uniform across all unitholders within a scheme on a given date.',topic:'NAV'},
      {q:'For an equity scheme with AUM of ₹2,000 crore, the additional expense allowed for inflows from B-30 cities is:',o:['Up to 0.30% of additional AUM','Flat 1%','Flat 2%','Not allowed'],a:0,e:'AMCs can charge an additional expense of up to 0.30 bps for B-30 city inflows, subject to certain conditions on retail investor share.',topic:'NAV'},
      {q:'NAV is applied based on:',o:['Time of application receipt only','Time of fund realization in scheme account','Whichever is later: application time or fund realization','Investor preference'],a:2,e:'Both conditions must be met before cut-off — application AND fund realization. Whichever happens later determines NAV applicability.',topic:'NAV'}

      {q:'The lock-in period for an ELSS (Equity Linked Savings Scheme) is:',o:['1 year','3 years','5 years','7 years'],a:1,e:'ELSS has a 3-year lock-in — the SHORTEST among all 80C investments. Tax deduction up to ₹1.5 lakh under Section 80C (old regime).',topic:'SCH'},
      {q:'Maximum NFO period (other than ELSS) is:',o:['7 days','15 days','30 days','45 days'],a:1,e:'NFO of an open-ended scheme cannot exceed 15 days. ELSS can have a 30-day NFO.',topic:'SCH'},
      {q:'An Index Fund aims to:',o:['Outperform the index','Replicate the performance of an index','Beat fund manager benchmarks','Avoid all market risks'],a:1,e:'Index funds passively track and replicate index performance. Tracking error is the deviation from benchmark — lower is better.',topic:'SCH'},
      {q:'An Exchange Traded Fund (ETF) is:',o:['Bought and sold only via the AMC','Listed and traded on stock exchanges like a share','Available only to institutional investors','A close-ended scheme'],a:1,e:'ETFs trade on exchanges in real-time. Authorized Participants create/redeem in creation units directly with the AMC.',topic:'SCH'},
      {q:'A Fund of Funds (FoF) invests in:',o:['Direct equity shares','Government bonds only','Other mutual fund schemes','Real estate'],a:2,e:'FoF invests in units of other mutual fund schemes. Note: TER includes both FoF expenses and underlying scheme expenses (cap of 2.25%).',topic:'SCH'},
      {q:'A Liquid Fund invests primarily in:',o:['Equity','Debt instruments with maturity up to 91 days','Long-term government securities','Real estate'],a:1,e:'Liquid funds invest in money market and debt instruments with residual maturity up to 91 days. Used as a parking option vs savings account.',topic:'SCH'},
      {q:'A Balanced Advantage / Dynamic Asset Allocation Fund is classified as:',o:['Equity scheme','Debt scheme','Hybrid scheme','Solution-oriented scheme'],a:2,e:'Hybrid scheme. Dynamically manages equity-debt allocation based on market valuations to reduce volatility.',topic:'SCH'},
      {q:'For a scheme to qualify as an EQUITY-oriented scheme for taxation, minimum equity allocation must be:',o:['51%','60%','65%','75%'],a:2,e:'For taxation, an equity-oriented fund must invest 65% or more in domestic equities. Below this, debt taxation rules apply.',topic:'SCH'},
      {q:'Solution-oriented schemes (Retirement Fund, Children\'s Fund) typically have a lock-in of:',o:['No lock-in','3 years','5 years or until retirement/majority — whichever is earlier','10 years'],a:2,e:'Solution-oriented schemes have a 5-year lock-in OR until retirement/majority, whichever is earlier.',topic:'SCH'},
      {q:'A Gilt Fund invests primarily in:',o:['Corporate bonds','Government securities','Bank deposits','Equity shares of PSUs'],a:1,e:'Gilt funds invest exclusively in Government Securities (Central + State). Zero credit risk but high interest-rate risk.',topic:'SCH'},
      {q:'A scheme that allows entry/exit only at specified intervals is:',o:['Open-ended','Close-ended','Interval scheme','ETF'],a:2,e:'Interval schemes are open for subscription/redemption only at predetermined intervals (specified transaction periods).',topic:'SCH'}

      {q:'Consolidated Account Statement (CAS) is sent to the investor:',o:['Daily','Monthly (if any transaction) and half-yearly otherwise','Annually','Only on request'],a:1,e:'CAS is sent monthly when transactions occur, and half-yearly even with no transactions. Consolidated across all folios using PAN.',topic:'OPS'},

      {q:'Cooling-off / Right of Refusal applies in:',o:['Any application within 14 days','Mis-sold products only as per investor charter','SIP only','ELSS only'],a:1,e:'Investor charter and grievance mechanisms allow recourse for mis-selling. Mutual funds don\'t have a blanket cooling-off period like insurance.',topic:'OPS'},
      {q:'Switching from a regular plan to a direct plan within the same scheme:',o:['Is not allowed','Is treated as redemption + fresh subscription for tax/exit load','Is free of any charges','Requires SEBI approval'],a:1,e:'Switch from regular to direct (or any switch) is treated as a redemption from one and subscription to another — taxable event and may attract exit load.',topic:'OPS'}

      {q:'Securities Transaction Tax (STT) is applicable on:',o:['All mutual fund transactions','Equity-oriented scheme redemptions and switches','Debt fund transactions','International fund SIPs only'],a:1,e:'STT applies to redemption/switch out of equity-oriented schemes. Not on debt funds.',topic:'TAX'},

      {q:'For ELSS, the tax deduction under Section 80C is up to:',o:['₹1,00,000','₹1,50,000','₹2,00,000','₹2,50,000'],a:1,e:'ELSS qualifies for deduction up to ₹1.5 lakh under Section 80C (old tax regime only — not in new regime).',topic:'TAX'},

      {q:'Capital loss from equity mutual funds can be:',o:['Carried forward for 4 years','Set off only against equity gains, carried forward 8 years','Cannot be carried forward','Set off against salary income'],a:1,e:'STCL can be set off against any capital gain. LTCL only against LTCG. Both can be carried forward 8 assessment years.',topic:'TAX'}

    description: 'Mandatory disclosure documents, Riskometer, addendum, updation cycles',
    questions: [
      {q:'The three mandatory scheme-related documents are:',o:['SID, SAI, KIM','SID, KIM, factsheet','Trust deed, IMA, custodian agreement','SAI, factsheet, addendum'],a:0,e:'The three mandatory documents are Scheme Information Document (SID), Statement of Additional Information (SAI), and Key Information Memorandum (KIM).',topic:'DOC'},
      {q:'The Scheme Information Document (SID) primarily contains:',o:['Statutory information about the AMC','Details of the particular scheme','Daily NAVs','Account statements'],a:1,e:'SID contains scheme-specific details — investment objective, asset allocation, risks, fees, fund manager. SAI has statutory info about the AMC/Mutual Fund.',topic:'DOC'},
      {q:'The Key Information Memorandum (KIM) is:',o:['A summary of SID and SAI for investors','A standalone document not related to SID/SAI','Sent only to existing investors','Filed only with SEBI, not given to investors'],a:0,e:'KIM is a summary of SID and SAI. SEBI mandates that every application form must be accompanied by the KIM.',topic:'DOC'},
      {q:'In the case of a fundamental attribute change, the AMC must:',o:['Just notify SEBI','Issue addendum and provide a 30-day no-load exit window','Discontinue the scheme','Increase the TER'],a:1,e:'Fundamental attribute changes (Reg 18(15A)) require an addendum and a no-load exit option for at least 30 days.',topic:'DOC'},
      {q:'Frequency of mandatory KIM updation:',o:['Once a month','At least once in half-year','Once a year','Only when scheme changes'],a:1,e:'KIM is updated at least once every half-year, within one month from the end of the half-year (Sept and March).',topic:'DOC'},
      {q:'Riskometer must be evaluated and disclosed by the AMC:',o:['Daily','Weekly','Monthly','Half-yearly'],a:2,e:'The Riskometer is evaluated and updated on a monthly basis. Any change must be conveyed via notice-cum-addendum and SMS/email to unitholders.',topic:'DOC'},
      {q:'The Riskometer of a scheme is published in the:',o:['Daily NAV statement','Front page of the SID','Custodian report','RTA monthly report'],a:1,e:'The Riskometer and the suitability statement appear on the front (cover) page of the SID.',topic:'DOC'},
      {q:'Specialized Investment Funds (SIFs) use which risk indicator (instead of Riskometer)?',o:['Riskometer with 6 levels','Risk Band with 5 levels','Beta indicator','No risk indicator'],a:1,e:'SIFs use a Risk-Band with 5 levels (Risk Band Level 1 lowest to Level 5 highest), as SIFs are inherently riskier than mutual fund schemes.',topic:'DOC'},
      {q:'SEBI\'s role with respect to scheme-related documents is to:',o:['Approve them','Disapprove them','Vet them and provide observations','Translate them'],a:2,e:'SEBI does NOT approve or disapprove SID/SAI — it provides observations which the AMC must incorporate. The documents are "vetted" not "approved".',topic:'DOC'},
      {q:'The "Caveat Emptor" principle in mutual fund investing means:',o:['Buyer beware — investor presumed to have read scheme documents','AMC takes full responsibility','SEBI guarantees returns','Distributor is liable for losses'],a:0,e:'Investors are presumed to have read and understood scheme documents before investing. They cannot later claim ignorance of disclosed facts.',topic:'DOC'},
      {q:'Among the six Riskometer levels, "Moderately High" risk is depicted using which colour?',o:['Red','Caramel','Neon Yellow','Irish Green'],a:1,e:'The 6 levels: Low (Irish Green), Low to Moderate (Chartreuse), Moderate (Neon Yellow), Moderately High (Caramel), High (Dark Orange), Very High (Red).',topic:'DOC'},
      {q:'An interim change to a scheme document, before the next regular update, is effected through:',o:['New SID','Addendum','Court order','Trustee resolution'],a:1,e:'Interim changes are effected via an addendum, which becomes part of the scheme documents and must accompany KIM until the next update.',topic:'DOC'}
    ]
  },
  {
    id: 'set_rsk',
    name: 'Set 9 — Risk, Return & Risk Measures',
    topic: 'RSK',
    duration: 1200,
    description: 'Standard deviation, Beta, Modified Duration, gating, side-pocketing',
    questions: [
      {q:'Standard deviation as a risk measure captures:',o:['Risk relative to the market','Total risk (variation in periodic returns vs scheme\'s own average)','Credit risk only','Interest rate risk only'],a:1,e:'Standard deviation measures total risk — fluctuation in periodic returns relative to the scheme\'s own average return. Higher SD = greater volatility.',topic:'RSK'},
      {q:'Beta of the market index, by definition, is:',o:['0','0.5','1','Greater than 1'],a:2,e:'The diversified market index has Beta = 1 by definition. Beta > 1 means the security/scheme is more volatile than the market; Beta < 1 means less volatile.',topic:'RSK'},
      {q:'A scheme with Beta of 1.2 will move __ when the market moves by 10%.',o:['8%','10%','12%','20%'],a:2,e:'Beta of 1.2 means the scheme moves 12% (1.2 × 10%) for a 10% market movement, both up and down.',topic:'RSK'},
      {q:'Beta as a risk measure is most relevant for:',o:['Liquid debt funds','Equity schemes','Gold ETFs','Overnight schemes'],a:1,e:'Beta — based on CAPM and systematic risk — is most relevant for equity schemes. Less meaningful for debt or commodity schemes.',topic:'RSK'},
      {q:'Modified Duration measures:',o:['Average time to maturity','Sensitivity of debt security value to interest rate changes','Credit risk of the issuer','Liquidity of the bond'],a:1,e:'Modified Duration measures the price sensitivity of a debt security to changes in interest rates. Higher MD = greater interest-rate risk.',topic:'RSK'},
      {q:'In annualizing the standard deviation calculated on weekly returns, you multiply by:',o:['sqrt(12)','sqrt(52)','sqrt(252)','sqrt(365)'],a:1,e:'Weekly SD × sqrt(52) annualizes it. Monthly returns × sqrt(12); Daily returns × sqrt(252) (trading days).',topic:'RSK'},
      {q:'Which type of risk CAN be reduced through diversification across unrelated securities?',o:['Market-wide systematic risk','Inflation risk','Company-specific (unsystematic) risk','Currency risk on foreign assets'],a:2,e:'Specific (unsystematic) risk can be reduced via diversification. Systematic / market-wide risk cannot.',topic:'RSK'},
      {q:'Side-pocketing (segregated portfolio) in a mutual fund scheme is invoked when:',o:['Markets are bullish','A debt instrument in the portfolio faces a credit event (default/rating downgrade)','NAV crosses a threshold','Investor base grows beyond a level'],a:1,e:'Segregated portfolio (side-pocketing) is created on a credit event in a debt instrument — to ring-fence the affected security from the main portfolio.',topic:'RSK'},
      {q:'According to SEBI, restriction on redemption (gating) may be imposed for a maximum of:',o:['5 working days in any 90-day period','10 working days in any 90-day period','30 working days in a year','Indefinitely'],a:1,e:'Gating may be imposed only for a maximum of 10 working days in any 90-day period, with Board of AMC + Trustees approval, and SEBI must be informed.',topic:'RSK'},
      {q:'When redemption restriction (gating) is imposed, redemptions up to ___ must be processed without restriction:',o:['₹50,000','₹1 lakh','₹2 lakhs','₹5 lakhs'],a:2,e:'Up to ₹2 lakhs must be redeemed without restriction. Amounts above ₹2 lakhs are subject to the gating; the first ₹2 lakh of each request is processed normally.',topic:'RSK'},
      {q:'Reinvestment risk in a debt portfolio refers to:',o:['Risk that the issuer will default','Risk that interim cash flows are reinvested at lower rates than originally assumed','Risk of currency depreciation','Risk that the AMC will close the scheme'],a:1,e:'Reinvestment risk is the risk that interim cash flows (coupons, partial redemptions) are reinvested at rates lower than originally assumed.',topic:'RSK'},
      {q:'A scheme can hold a maximum of __ of its NAV in securities issued by a single issuer.',o:['5%','10%','15%','25%'],a:1,e:'SEBI regulations cap exposure to a single issuer at 10% of NAV (with limited extensions for select instruments under board approvals).',topic:'RSK'}
    ]
  },
  {
    id: 'set_prf',
    name: 'Set 10 — Benchmarks & Scheme Selection',
    topic: 'PRF',
    duration: 1200,
    description: 'PRI/TRI, Sharpe, Treynor, Alpha, Information Ratio, Tracking Error, scheme selection',
    questions: [
      {q:'Since February 2018, SEBI has mandated mutual fund schemes to be benchmarked against:',o:['Price Return variant of Index (PRI)','Total Return variant of Index (TRI)','Custom AMC index','Sensex only'],a:1,e:'From 1 Feb 2018, schemes are benchmarked to TRI — which captures dividends/interest in addition to capital gains, ensuring a fair comparison.',topic:'PRF'},
      {q:'The Total Return Index (TRI) differs from Price Return Index (PRI) in that TRI:',o:['Excludes capital gains','Includes dividends and interest payments in addition to capital gains','Is calculated only for debt indices','Is published weekly'],a:1,e:'TRI = PRI + dividend/interest reinvested. Comparing schemes (which earn dividends) against PRI gave them an unfair advantage; TRI corrects this.',topic:'PRF'},
      {q:'Sharpe Ratio is calculated as:',o:['(Rs - Rf) / Beta','(Rs - Rf) / Standard Deviation','Rs / Rf','Beta × Standard Deviation'],a:1,e:'Sharpe Ratio = (Scheme Return - Risk-Free Return) / Standard Deviation. Risk premium per unit of TOTAL risk.',topic:'PRF'},
      {q:'Treynor Ratio differs from Sharpe Ratio in that the denominator uses:',o:['Variance instead of Standard Deviation','Beta instead of Standard Deviation','Modified Duration instead of Standard Deviation','Tracking Error instead of Standard Deviation'],a:1,e:'Treynor Ratio = (Rs - Rf) / Beta. Risk premium per unit of SYSTEMATIC risk. Treynor is most useful for diversified equity schemes.',topic:'PRF'},
      {q:'Alpha measures:',o:['Total risk of a scheme','Difference between actual return and optimal (market-implied) return','Standard deviation of returns','Correlation with the benchmark'],a:1,e:'Alpha is the excess return generated by the fund manager over what was expected given the scheme\'s Beta. Positive Alpha = outperformance.',topic:'PRF'},
      {q:'Tracking error of an index fund is best described as:',o:['Absolute returns of the fund','Standard deviation of excess returns of the fund vs the benchmark','The TER of the fund','The fund manager\'s alpha'],a:1,e:'Tracking error = standard deviation of (fund returns - benchmark returns). For index funds, lower is better. For active funds, used to measure consistency of outperformance.',topic:'PRF'},
      {q:'Information Ratio is calculated as:',o:['(Portfolio Return - Benchmark Return) / Standard Deviation of Excess Returns','Portfolio Return / Risk-Free Return','Sharpe + Treynor','Beta / Standard Deviation'],a:0,e:'IR = (Portfolio Return - Benchmark Return) / Standard Deviation of Excess Returns. SEBI mandates AMCs to disclose IR daily.',topic:'PRF'},
      {q:'Among the following, which risk-adjusted return measure is mandatorily disclosed by AMCs daily?',o:['Sharpe Ratio','Treynor Ratio','Information Ratio','Alpha'],a:2,e:'SEBI made disclosure of Information Ratio mandatory (Jan 2025 circular). It must be disclosed daily on AMC and AMFI websites.',topic:'PRF'},
      {q:'For a hybrid scheme with 65% equity and 35% debt, an appropriate benchmark is:',o:['Pure equity index like Sensex','Pure debt index like 10-year G-Sec','Synthetic / blended index (65% equity index + 35% debt index)','Gold price'],a:2,e:'Hybrid schemes use blended/synthetic benchmarks reflecting the asset allocation, e.g., 65% Sensex + 35% I-Bex.',topic:'PRF'},
      {q:'For a Gilt Fund, the most appropriate benchmark would be:',o:['CRISIL Liquid Fund Index','I-Bex (sovereign bond index)','Nifty 50','Gold price'],a:1,e:'Gilt funds invest only in Government Securities. Indices based on G-Secs (e.g., I-Bex / Nifty G-Sec) are appropriate benchmarks.',topic:'PRF'},
      {q:'In core-and-satellite portfolio construction, the "core" portfolio typically holds:',o:['Tactical short-term bets','Long-term, broadly aligned holdings (large-cap, diversified equity, debt funds)','Only sector funds','Gold ETFs only'],a:1,e:'Core = long-term, aligned with goals (diversified equity, large-cap, debt). Satellite = tactical bets (sector funds, gilts during rate cuts, gold during uncertainty).',topic:'PRF'},
      {q:'In ranking the equity scheme categories from HIGHER to LOWER risk, the correct order is:',o:['Large Cap → Mid Cap → Small Cap','Small Cap → Mid Cap → Large Cap','Mid Cap → Small Cap → Large Cap','All have equal risk'],a:1,e:'Small Cap > Mid Cap > Large Cap in risk. Smaller companies have higher volatility and lower liquidity, hence higher risk.',topic:'PRF'}
    ]
  },
  {
    id: 'set_adv',
    name: 'Set 11 — Active Management, Analysis & Risk Concepts',
    topic: 'PRF',
    duration: 1200,
    description: 'Fundamental vs technical analysis, EPS, P/E, market timing, systematic vs unsystematic risk',
    questions: [
      {q:'A fund manager who builds a portfolio differing from the benchmark to outperform it is following a:',o:['Passive strategy','Active management strategy','Index replication strategy','Hold-to-maturity strategy'],a:1,e:'Active management seeks to beat the benchmark via security selection and/or market timing. Passive funds aim to merely replicate.',topic:'PRF'},
      {q:'The two primary strategies in active equity management are:',o:['Buy and hold; sell and exit','Security selection and market timing','Long only and short only','Cash and equivalent allocation'],a:1,e:'Active managers use security selection (picking good stocks) and market timing (deciding when to enter/exit) to generate alpha.',topic:'PRF'},
      {q:'Fundamental analysis is most appropriate for:',o:['Intraday trading','Short-term speculation','Long-term investment decisions','Currency hedging'],a:2,e:'Fundamental analysis (financials, business quality, management) is used for long-term investment decisions. Technical analysis is used for short-term timing.',topic:'PRF'},
      {q:'Technical analysts (chartists) primarily study:',o:['Company financial statements','Price and volume charts to identify trends','Macro-economic policy','Credit ratings'],a:1,e:'Technical analysts study price-volume patterns to identify trends, support, resistance levels — basis for short-term trading decisions.',topic:'PRF'},
      {q:'Earnings per Share (EPS) is calculated as:',o:['Net profit / Total assets','Net profit after tax / Number of equity shares outstanding','Revenue / Number of shares','Market cap / Net profit'],a:1,e:'EPS = Net Profit After Tax ÷ Number of Equity Shares Outstanding. Tells how much profit the company earned per share.',topic:'PRF'},
      {q:'Price to Earnings (P/E) Ratio is:',o:['Market price per share / EPS','EPS / Market price','Net profit / Market cap','Book value / Market price'],a:0,e:'P/E = Market Price per share ÷ EPS. Indicates how much investors are willing to pay per rupee of earnings.',topic:'PRF'},
      {q:'A high P/E ratio relative to peers may indicate that:',o:['Always means the share is overpriced','The market expects strong future earnings growth (could be justified)','The share is cheap','The company is loss-making'],a:1,e:'High P/E may reflect strong expected growth — not necessarily overvaluation. Validity depends on the company\'s actual prospects vs the implied growth.',topic:'PRF'},
      {q:'Systematic risk is also referred to as:',o:['Diversifiable risk','Specific risk','Market risk / Non-diversifiable risk','Liquidity risk'],a:2,e:'Systematic risk = market risk = non-diversifiable risk. Affects all securities; cannot be eliminated through diversification.',topic:'RSK'},
      {q:'Per finance theory, investors are rewarded for taking:',o:['Both systematic and unsystematic risk','Only unsystematic (diversifiable) risk','Only systematic (non-diversifiable) risk','Only liquidity risk'],a:2,e:'Investors are compensated only for non-diversifiable (systematic) risk. Diversifiable risk can be eliminated for free via diversification, so the market doesn\'t reward taking it.',topic:'RSK'},
      {q:'A scheme is described as a "pass-through vehicle" because:',o:['The AMC retains the gains','All investment risks are passed onto unitholders, who are the beneficial owners','The trustee absorbs losses','SEBI guarantees the principal'],a:1,e:'In a mutual fund, all gains and risks pass through to unitholders, who are the beneficial owners of the trust. Unlike an FD, the AMC does not promise a fixed return.',topic:'RSK'}
    ]
  },
  {
    id: 'set_kyc',
    name: 'Set 12 — KYC, NFO & Operational Details',
    topic: 'OPS',
    duration: 1200,
    description: 'KYC documents, PEKRN, CKYC/cKYCR, e-KYC, NFO mechanics, ARN/EUIN, operational rules',
    questions: [
      {q:'KYC compliance is mandatory for:',o:['Only investors above ₹1 lakh','All investors regardless of investment value','Only resident investors','Only individual investors'],a:1,e:'All investors — individual and non-individual, including joint holders, NRIs, PoA holders, guardians of minors — must be KYC compliant regardless of investment value.',topic:'OPS'},
      {q:'PAN is mandatory for mutual fund investments EXCEPT for:',o:['NRIs','Investments up to ₹50,000 per investor per year per MF','Senior citizens','SIP investors only'],a:1,e:'PAN-exempt: investments (lump-sum + SIP combined) up to ₹50,000 per investor per year per mutual fund. Also: officials of govt./court, Sikkim residents, certain UN entities.',topic:'OPS'},
      {q:'For Micro-SIPs (PAN-exempt), the investor is issued a:',o:['ARN','EUIN','PEKRN (PAN Exempt KYC Reference Number)','Folio number'],a:2,e:'Investors using PAN exemption receive a PEKRN (PAN Exempt KYC Reference Number) from the KRA, quoted on the application form along with photo-ID.',topic:'OPS'},
      {q:'The benefit of the centralised KYC process via KRAs is that:',o:['Each AMC must do its own KYC','Once KYC is done with one capital market intermediary, it is valid across the capital market','KYC must be redone every year','Only mutual funds use this'],a:1,e:'KRAs centralise KYC across the capital market. Once done with one SEBI intermediary (broker, MF, depository participant), the investor can transact across the market without repeating KYC.',topic:'OPS'},
      {q:'CERSAI was authorised by the Government of India to function as the:',o:['Stock exchange','Central KYC Records Registry (cKYCR) under PML Rules','Mutual fund regulator','Pension regulator'],a:1,e:'Government of India (Nov 2015 notification) authorised CERSAI to act as the Central KYC Records Registry under Prevention of Money Laundering Rules.',topic:'OPS'},
      {q:'In-Person Verification (IPV) of an investor must be done:',o:['Optionally, by the distributor','By the capital market intermediary as part of the KYC process','Only by SEBI','Only for amounts above ₹1 lakh'],a:1,e:'IPV is mandatory: the SEBI-registered intermediary must verify the investor in person before uploading data to KRA. Confirms identity and prevents impersonation.',topic:'OPS'},
      {q:'The maximum period for an NFO of a non-ELSS open-ended scheme is:',o:['7 days','15 days','30 days','45 days'],a:1,e:'NFO of a non-ELSS open-ended scheme can be open for a maximum of 15 days. ELSS schemes can have up to 30-day NFOs.',topic:'OPS'},
      {q:'After NFO closure, an open-ended scheme must reopen for ongoing sale and repurchase within:',o:['1 day','5 business days','15 days','30 days'],a:1,e:'Open-ended schemes must reopen for sale/repurchase within 5 business days from the closure of the NFO.',topic:'OPS'},
      {q:'A distributor must obtain which credential before distributing mutual funds?',o:['Only PAN','ARN from AMFI after passing NISM V-A and KYD','Only EUIN','Sebi registration number'],a:1,e:'A distributor must pass NISM V-A, complete KYD (Know Your Distributor), and obtain ARN from AMFI before distributing mutual fund schemes.',topic:'OPS'},
      {q:'The EUIN of the relationship manager is captured on the application form to:',o:['Replace the ARN','Track the specific individual employee who advised the investor','Record investor preferences','Replace KYC'],a:1,e:'EUIN identifies the individual employee/RM within the ARN-holder firm who advised the investor — protects against future "execution-only" mis-selling claims and ensures accountability.',topic:'OPS'}
    ]
  },
  {
    id: 'set_mock3',
    name: 'Mock Test 2 — 30Q (KYC, NFO, Tax-heavy)',
    topic: 'MIX',
    duration: 1800,
    description: 'Mock 2 — operational depth: KYC/CERSAI, NFO, value vs growth, taxation edge-cases',
    questions: [
      {q:'The body that has been authorised to act as Central KYC Records Registry (cKYCR) is:',o:['SEBI','RBI','CERSAI','AMFI'],a:2,e:'CERSAI was authorised by the Government of India (Nov 2015) to act as cKYCR under Prevention of Money Laundering Rules.',topic:'OPS'},
      {q:'For mutual fund investments up to which limit per investor per year per MF, PAN is not mandatory?',o:['₹25,000','₹50,000','₹1,00,000','₹2,00,000'],a:1,e:'PAN-exempt limit is ₹50,000 per investor per year per mutual fund (combined limit for SIPs and lump-sum).',topic:'OPS'},
      {q:'Which of the following is NOT a valid alternative photo-ID for PAN-exempt investors?',o:['Voter ID','Driving License','Credit Card','Passport'],a:2,e:'Credit card is excluded since it may not be backed by a bank account. Voter ID, Driving License, Passport, Aadhaar etc. are valid.',topic:'OPS'},
      {q:'Maximum NFO period for an ELSS scheme:',o:['15 days','30 days','45 days','60 days'],a:1,e:'ELSS NFOs can be open up to 30 days. Other open-ended schemes are capped at 15 days.',topic:'OPS'},
      {q:'A fund manager who follows a value investing style is most likely to look for:',o:['Stocks with very high P/E ratios','Stocks priced lower than intrinsic value with margin of safety','Index-replication','Sector concentration'],a:1,e:'Value investing seeks undervalued securities — those trading below intrinsic value. Often associated with low P/E, low P/B stocks.',topic:'PRF'},
      {q:'Growth investing typically focuses on:',o:['Mature dividend-paying stocks','Companies with above-average earnings growth potential','Government bonds','Gold ETFs'],a:1,e:'Growth investing targets companies with above-average earnings growth, often willing to pay higher P/E for that growth potential.',topic:'PRF'},
      {q:'A focused equity scheme can hold a maximum of how many stocks?',o:['10','20','30','50'],a:2,e:'SEBI scheme categorisation: Focused funds invest in a maximum of 30 stocks, with concentration on a smaller universe of high-conviction picks.',topic:'SCH'},
      {q:'Multi-cap funds, as per SEBI categorisation, must invest a minimum of __% each in large-cap, mid-cap, and small-cap stocks.',o:['10%','15%','25%','33%'],a:2,e:'Multi-cap funds must invest a minimum of 25% each in large-cap, mid-cap, and small-cap stocks (total at least 75% in equity).',topic:'SCH'},
      {q:'An Arbitrage Fund typically invests in:',o:['Debt instruments only','Cash market and futures market simultaneously to capture spreads','Distressed assets','Foreign equity'],a:1,e:'Arbitrage funds simultaneously buy in cash market and sell in futures (or vice versa) to capture price spreads. Treated as equity for tax (≥65% equity exposure).',topic:'SCH'},
      {q:'For tax purposes, an Arbitrage Fund is generally treated as:',o:['Debt fund','Equity-oriented fund (≥65% equity exposure)','International fund','Hybrid'],a:1,e:'Arbitrage funds maintain ≥65% gross equity exposure (cash + futures) and are taxed as equity-oriented schemes.',topic:'TAX'},
      {q:'STT (Securities Transaction Tax) is applicable on:',o:['All MF redemptions','Redemption / switch out of equity-oriented MF schemes','Debt fund redemptions','SIP investments'],a:1,e:'STT applies to redemption and switch-out of equity-oriented schemes. Not levied on debt fund transactions.',topic:'TAX'},
      {q:'Section 80C deduction for ELSS investment is available only under the:',o:['New tax regime','Old tax regime','Both regimes','For senior citizens only'],a:1,e:'Sec 80C deduction (up to ₹1.5 lakh) for ELSS is available only under the OLD tax regime. The new regime does not permit most deductions.',topic:'TAX'},
      {q:'For an investor in the highest tax bracket, the most tax-efficient form of mutual fund earning is generally:',o:['IDCW (Dividend) option','Growth option held >12 months for equity LTCG','Frequent switches','Daily IDCW reinvestment'],a:1,e:'Growth + LTCG (12.5% above ₹1.25L for equity) is typically more tax-efficient than IDCW (taxed at slab rate). Less frequent transactions also reduce STT/STCG drag.',topic:'TAX'},
      {q:'Stamp duty on mutual fund unit issuance/transfer was introduced from:',o:['April 1, 2018','July 1, 2020','April 1, 2023','January 1, 2024'],a:1,e:'Stamp duty on mutual fund units (issuance and transfer) was introduced from 1 July 2020 — 0.005% on issuance and 0.015% on transfer.',topic:'TAX'},
      {q:'The rate of stamp duty applicable to mutual fund unit issuance is:',o:['0.001%','0.005%','0.015%','0.1%'],a:1,e:'Stamp duty on issuance (purchase / SIP / dividend reinvestment) is 0.005% of the transaction value.',topic:'TAX'},
      {q:'The Investment Management Agreement (IMA) is signed between:',o:['Sponsor and AMC','Trustees and AMC','SEBI and AMC','Custodian and Trustees'],a:1,e:'IMA is signed between Trustees and AMC, governing the AMC\'s management of mutual fund schemes.',topic:'STR'},
      {q:'A change in the sponsor of a mutual fund requires:',o:['Just a notice to investors','Prior approval of SEBI and a no-load exit window','No formal action','Approval of unitholders only'],a:1,e:'Change of sponsor or controlling interest requires SEBI prior approval AND a no-load exit window for unitholders to exit if they wish.',topic:'STR'},
      {q:'The SEBI Regulation governing mutual funds in India is:',o:['SEBI (Mutual Funds) Regulations, 1996','RBI Master Directions, 2016','Companies Act, 2013','Indian Trusts Act, 1882'],a:0,e:'SEBI (Mutual Funds) Regulations, 1996 (as amended over time) is the primary regulation. Indian Trusts Act, 1882 governs the trust structure separately.',topic:'REG'},
      {q:'For a debt scheme with an NAV in the range of ₹10–₹100, NAV is typically rounded to:',o:['1 decimal place','2 decimal places','4 decimal places','No rounding required'],a:2,e:'For debt schemes (and money market / liquid schemes), NAVs are computed and disclosed up to 4 decimal places to capture small daily accruals accurately.',topic:'NAV'},
      {q:'For an equity scheme, NAV is typically disclosed up to:',o:['1 decimal place','2 decimal places','4 decimal places','Up to AMC discretion'],a:1,e:'Equity scheme NAVs are typically disclosed up to 2 decimal places (sometimes 4). Debt schemes go to 4 decimals due to smaller daily accruals.',topic:'NAV'},
      {q:'The B-30 incentive (additional expense up to 0.30% of additional AUM) is permitted for inflows from:',o:['Top 30 cities','Beyond top 30 cities (B-30 cities)','Foreign investors','HNI investors only'],a:1,e:'B-30 = Beyond Top 30 cities. AMCs can charge up to 0.30 bps additional expense for inflows from B-30 cities to incentivise distribution outside metros.',topic:'NAV'},
      {q:'For a Liquid Fund, NAV is calculated:',o:['Only on business days','For each calendar day (including weekends and holidays)','Once a week','Monthly'],a:1,e:'Liquid fund NAVs are computed for EACH CALENDAR DAY (including weekends and holidays) — since they hold money market instruments that accrue interest daily.',topic:'NAV'},
      {q:'The Information Ratio (IR) must be disclosed by AMCs:',o:['Annually','Half-yearly','Daily on AMC and AMFI websites','Only on demand'],a:2,e:'SEBI (Jan 2025 circular) mandates daily disclosure of Information Ratio on the AMC website and in a comparable format on AMFI website.',topic:'PRF'},
      {q:'A fund\'s portfolio turnover ratio of 200% indicates:',o:['Fund holds securities for an average of 6 months','Fund holds securities for an average of 5 years','Very low trading','Index fund'],a:0,e:'Portfolio turnover of 200% (or 2x) implies the entire portfolio is rotated twice a year — average holding period ~6 months. High turnover = higher transaction costs.',topic:'PRF'},
      {q:'Across mutual fund schemes within the same category, all else equal, a LOWER expense ratio (TER) typically:',o:['Hurts long-term returns','Helps long-term net returns to investors','Has no effect','Increases tracking error'],a:1,e:'Lower TER means more of the gross return reaches the investor. Especially powerful over long periods due to compounding.',topic:'PRF'},
      {q:'Riskometer evaluation is required to be done:',o:['Daily','Weekly','Monthly','Annually'],a:2,e:'Riskometer must be evaluated and updated on a monthly basis. Changes must be communicated via notice-cum-addendum and SMS/email to unitholders.',topic:'DOC'},
      {q:'A side-pocket (segregated portfolio) gets created when:',o:['NAV crosses a high','A debt instrument in the portfolio faces a credit event (downgrade/default)','Investor base grows above a threshold','Markets are bullish'],a:1,e:'On a credit event in a debt instrument (rating downgrade below investment grade or default), the AMC can create a segregated portfolio to ring-fence the affected security.',topic:'RSK'},
      {q:'In a segregated portfolio, the affected security is:',o:['Sold immediately at any price','Carved out into a separate portfolio; only existing unitholders at cut-off get units; no fresh inflows allowed','Returned to the issuer','Transferred to SEBI'],a:1,e:'On segregation, only unitholders existing at the credit-event date receive units in the segregated portfolio. Recoveries (when realised) are distributed pro-rata.',topic:'RSK'},
      {q:'For an investor with a 1-year horizon and capital safety priority, the most suitable scheme category is:',o:['Small-cap equity','Liquid / Ultra Short Duration debt fund','Sector fund','International equity'],a:1,e:'For 1-year horizon and capital safety, liquid or ultra-short duration debt funds are most suitable due to low credit and interest rate risk.',topic:'PRF'},
      {q:'A Fund of Funds (FoF) investing in equity-oriented schemes is taxed as per:',o:['Equity tax rules (12.5% LTCG above ₹1.25L)','Debt tax rules (slab rate)','International fund rules','Hybrid rules'],a:1,e:'Until recently, ALL FoFs were taxed as debt (slab rate). Post Budget 2024, FoFs that hold ≥65% in equity-oriented MF units may qualify for equity tax — verify the latest rule for the specific FoF.',topic:'TAX'}
    ]
  },
  {
    id: 'set_mock2',
    name: 'Mock Test 3 — 30Q (cross-topic mix)',
    topic: 'MIX',
    duration: 1800,
    description: 'Mock 3 — broad mix across all topics; 30 Qs in 30 mins',
    questions: [
      {q:'Among the following biases, "Herd Mentality" leads investors to:',o:['Always go against the crowd','Follow what others are doing without independent analysis','Stick only to familiar investments','Anchor on recent events'],a:1,e:'Herd mentality — investors do what others do without independent analysis. Often counterproductive in markets.',topic:'INV'},
      {q:'A bond investor who expects interest rates to fall should:',o:['Sell long-duration bonds and buy short-duration','Sell short-duration bonds and buy long-duration','Hold cash','Buy equity'],a:1,e:'When rates fall, long-duration bonds appreciate more. Investor expecting a rate cut should switch from short to long duration to capture price gains.',topic:'INV'},
      {q:'For a Specialized Investment Fund (SIF), the risk indicator is the:',o:['Riskometer with 6 levels','Risk-Band with 5 levels','Both Riskometer and Risk-Band','None of the above'],a:1,e:'SIFs are riskier than mutual fund schemes; SEBI mandates a Risk-Band with 5 levels for SIFs to differentiate from the mutual fund Riskometer.',topic:'DOC'},
      {q:'The KIM must be accompanied by:',o:['The trust deed','The application form','The IMA','The custodian agreement'],a:1,e:'SEBI mandates every application form to be accompanied by KIM. The KIM may also include the latest applicable addendum.',topic:'DOC'},
      {q:'Which is the most accurate description of Variance as a risk measure?',o:['Square root of Standard Deviation','Square of Standard Deviation','Same as Beta','Same as Modified Duration'],a:1,e:'Variance = SD². Equivalently, SD = sqrt(Variance). Both measure dispersion of returns from the mean.',topic:'RSK'},
      {q:'Weighted Average Maturity in a debt scheme indicates:',o:['Credit quality','Interest rate sensitivity at portfolio level','Liquidity','Tax efficiency'],a:1,e:'WAM at portfolio level indicates interest rate sensitivity. Higher WAM = higher sensitivity to interest rate changes (similar to Modified Duration).',topic:'RSK'},
      {q:'Higher Sharpe Ratio is generally:',o:['Worse','Better','Neutral','Indicative of higher risk only'],a:1,e:'Higher Sharpe Ratio = higher risk premium per unit of risk = better risk-adjusted performance. Compare only across similar schemes.',topic:'PRF'},
      {q:'For an investor needing periodic income, the most suitable mutual fund category would be:',o:['Aggressive small-cap equity','Sector funds','Debt schemes','Sector ETFs'],a:2,e:'Debt schemes and Income Distribution cum Capital Withdrawal options are typically suitable for income-seeking investors.',topic:'PRF'},
      {q:'For an equity-oriented mutual fund scheme, what is the cut-off time for redemption?',o:['1:30 PM','2:30 PM','3:00 PM','5:00 PM'],a:2,e:'Redemption cut-off for equity and debt (other than liquid) is 3:00 PM. Same-day NAV if before, next business day NAV if after.',topic:'NAV'},
      {q:'For purchase in an equity scheme of any amount, the applicable NAV is the NAV of the day:',o:['Of application receipt','When funds are realized and available for utilisation before cut-off','Decided by the AMC','At investor\'s choice'],a:1,e:'Post Feb 2021, applicable NAV is when funds are credited to the scheme account before cut-off, regardless of size of investment.',topic:'NAV'},
      {q:'AMC\'s minimum net worth requirement of ₹50 crore must be:',o:['Met only at the time of registration','Maintained at all times','Met only when AUM exceeds ₹500 cr','Met annually'],a:1,e:'AMC must maintain minimum net worth of ₹50 crore at all times — not just at registration.',topic:'STR'},
      {q:'The Investment Management Agreement (IMA) is between:',o:['Trustee and AMC','SEBI and AMC','Sponsor and Trustee','RTA and Custodian'],a:0,e:'IMA is signed between the Trustees and the AMC, governing the AMC\'s management of the schemes.',topic:'STR'},
      {q:'Trail commission to a distributor:',o:['Is paid only at the time of investment','Is paid as long as the investor stays invested','Is paid only if the fund beats benchmark','Is banned by SEBI'],a:1,e:'Trail commission accrues recurring as long as investor holds units, aligning distributor incentives with retention. Upfront commissions for retail are banned.',topic:'REG'},
      {q:'A distributor accepting investor cheques in their own bank account is:',o:['Permitted with disclosure','Strictly prohibited under AMFI Code of Conduct','Allowed up to ₹50,000','A standard practice'],a:1,e:'Distributors must NEVER take investor money in their own account. Funds must flow directly to the scheme account.',topic:'REG'},
      {q:'EUIN is required for:',o:['The ARN-holder entity','Each individual employee/relationship manager who advises investors','Investors only','SEBI itself'],a:1,e:'EUIN identifies the individual employee/RM (within the ARN-holder firm) who advised the investor — enables accountability and prevents mis-selling claims.',topic:'REG'},
      {q:'Equity-oriented schemes are taxed favourably only if they invest a minimum of __ in domestic equities.',o:['51%','60%','65%','75%'],a:2,e:'For favourable equity taxation (LTCG @ 12.5%, STCG @ 20%), the scheme must hold ≥65% in domestic equities, calculated on a quarterly average basis.',topic:'TAX'},
      {q:'For LTCG on equity-oriented mutual funds, the exemption threshold is:',o:['₹1 lakh','₹1.25 lakh','₹2 lakh','₹2.5 lakh'],a:1,e:'Post Budget 2024 (effective 23 July 2024), LTCG exemption is ₹1.25 lakh per financial year (raised from ₹1 lakh).',topic:'TAX'},
      {q:'For an investor in a higher tax bracket, dividends from mutual funds (IDCW) are:',o:['Tax-free','Taxed at slab rate in investor hands','Subject to flat 10% TDS only','Subject to DDT'],a:1,e:'IDCW (dividends) are taxable at slab rate in investor hands (post April 2020). DDT regime is abolished.',topic:'TAX'},
      {q:'The maximum number of nominees that can be specified in a mutual fund folio is:',o:['1','2','3','5'],a:2,e:'A folio can have up to 3 nominees. Allocation percentages must aggregate to 100%.',topic:'OPS'},
      {q:'Consolidated Account Statement (CAS) is sent to investors:',o:['Daily','Monthly only when transactions occur','Half-yearly only','Both monthly (with transactions) and half-yearly (without)'],a:3,e:'CAS is sent monthly when there is any transaction in any folio (across MFs by PAN), and half-yearly even when no transaction occurs.',topic:'OPS'},
      {q:'A Systematic Transfer Plan (STP) involves:',o:['Investing a fixed amount regularly','Withdrawing a fixed amount regularly','Transferring a fixed amount from one scheme to another at specified intervals','Switching plans within same scheme'],a:2,e:'STP transfers fixed amounts from one scheme to another at regular intervals — typically debt → equity for systematic deployment of lump sums.',topic:'OPS'},
      {q:'The minimum investment for SIP in a mutual fund scheme can be as low as:',o:['₹500','₹250 (some AMCs)','₹1,000','₹5,000'],a:1,e:'SEBI / AMFI permit small-ticket SIPs; some AMCs allow SIPs starting ₹250-₹500 to drive financial inclusion.',topic:'OPS'},
      {q:'A scheme with mandate-allocated equity exposure between 65% and 80% (with debt 20-35%) is best categorized as:',o:['Conservative Hybrid','Balanced Hybrid','Aggressive Hybrid','Multi-Asset Allocation'],a:2,e:'Aggressive Hybrid: 65-80% equity, 20-35% debt. Balanced Hybrid: 40-60% equity. Conservative Hybrid: 10-25% equity.',topic:'SCH'},
      {q:'Smart Beta funds aim to:',o:['Replicate a market-cap index passively','Capture systematic factor premia (value, momentum, quality, low-vol) using rules-based portfolios','Beat the market through active stock picking','Track gold prices'],a:1,e:'Smart Beta funds use rules-based, factor-tilted strategies (value, momentum, quality, low volatility) — between passive and active.',topic:'SCH'},
      {q:'Index Funds are subject to:',o:['No tracking error','Some tracking error due to expenses, cash holdings and rebalancing lags','Higher tracking error than active funds','Tracking error only on rebalancing days'],a:1,e:'All index funds have some tracking error due to expenses, cash drag and rebalancing imperfections — though aim to minimize it.',topic:'SCH'},
      {q:'For a debt fund purchased BEFORE 1 April 2023 and held >36 months, the holder gets:',o:['No special tax treatment','LTCG with indexation benefit at 20%','Slab rate taxation','Tax-free returns'],a:1,e:'Pre-April 2023 debt fund purchases held >36 months still qualify for LTCG @ 20% with indexation. Post-April 2023 purchases are slab-taxed.',topic:'TAX'},
      {q:'The SEBI rebalancing window for non-Index, non-ETF schemes following passive breaches is:',o:['10 business days','20 business days','30 business days','60 business days'],a:2,e:'30 business days for rebalancing schemes (other than Index Funds and ETFs) following passive breaches. Overnight Funds are exempt.',topic:'INV'},
      {q:'In rebalancing strategically allocated portfolios, the action that automatically happens is:',o:['Buy high, sell low','Buy low, sell high','Always buy more equity','Always reduce equity'],a:1,e:'Rebalancing to target allocation forces selling assets that have gone up (high) and buying assets that have gone down (low) — disciplined buy low, sell high.',topic:'INV'},
      {q:'A scheme\'s SID has been "vetted" by SEBI. This means:',o:['SEBI has approved the scheme','SEBI has provided observations the AMC must incorporate','SEBI guarantees the returns','SEBI has ranked the scheme'],a:1,e:'Vetting = SEBI provides observations; AMC must incorporate. SEBI does not approve, certify or rank schemes.',topic:'DOC'},
      {q:'Among Sharpe, Treynor, and Information Ratio — which is mandatorily disclosed by AMCs daily on their and AMFI websites?',o:['Sharpe Ratio','Treynor Ratio','Information Ratio','None'],a:2,e:'IR is mandated for daily disclosure (SEBI Jan 2025). Sharpe, Treynor, Alpha are not mandatory daily disclosures.',topic:'PRF'}
    ]
  },
  {
    id: 'set_mock4',
    name: 'Mock Test 4 — 30Q (NISM-style sample questions)',
    topic: 'MIX',
    duration: 1800,
    description: 'Paraphrased and adapted from official NISM workbook sample questions across chapters',
    questions: [
      {q:'Which among the following investment avenues does NOT offer income on a regular basis?',o:['Real estate (rental income)','Physical gold','Stocks (dividends)','Debentures (interest)'],a:1,e:'Physical gold does not generate any current income — investor relies entirely on capital appreciation. Real estate, stocks and debentures all generate periodic income.',topic:'INV'},
      {q:'The purchasing power of currency changes primarily on account of:',o:['Asset allocation','Compound interest','Inflation','Diversification'],a:2,e:'Inflation erodes the purchasing power of money. Real returns must be measured after adjusting nominal returns for inflation.',topic:'INV'},
      {q:'When the interest rate in the economy increases, the price of existing bonds:',o:['Increases','Fluctuates randomly','Decreases','Stays the same'],a:2,e:'Bond prices and interest rates move inversely. When rates rise, existing bond prices fall to align their yield with new market rates.',topic:'INV'},
      {q:'The "real rate of return" is best described as the return:',o:['After payment of all expenses','After taxes','After adjusting for risks','After adjusting for inflation'],a:3,e:'Real rate of return = nominal return adjusted for inflation. Captures actual change in purchasing power.',topic:'INV'},
      {q:'NAV indicates how much money can be generated per unit of mutual fund in case the scheme is:',o:['Launched','Liquidated','Renamed','Merged'],a:1,e:'NAV represents the per-unit value of the scheme — i.e., what each unitholder would theoretically receive if all securities were liquidated and liabilities settled.',topic:'NAV'},
      {q:'In the sectoral and thematic funds category, an AMC can launch:',o:['Only one such scheme per AMC','As many schemes as they want, subject to the condition that overlap between two funds is less than 50%','Up to a maximum of 5 such funds','Only with SEBI special approval'],a:1,e:'AMCs can launch multiple sectoral/thematic schemes provided portfolio overlap between any two such schemes is less than 50%.',topic:'SCH'},
      {q:'Whose role is it to track corporate actions like bonus, dividend, or rights issues in companies where the mutual fund scheme has invested?',o:['Registrar and Transfer Agent','Custodian','Auditors of the AMC','Unitholders'],a:1,e:'The Custodian tracks and processes corporate actions on the securities held in safe custody — including bonus, dividends, rights issues, and other entitlements.',topic:'STR'},
      {q:'AMFI is best described as:',o:['An association of MF AMCs in India','A Self-Regulatory Organisation (SRO) of MF AMCs in India','The regulator for MF AMCs in India','An association of MF distributors in India'],a:0,e:'AMFI is the industry association of asset management companies. It is NOT a regulator (SEBI is) and not an SRO. Distributors are members but it is fundamentally an AMC body.',topic:'STR'},
      {q:'For valuation of debt securities for mutual fund NAV, the SEBI-approved valuation agencies are:',o:['AMFI','NSE & BSE','CRISIL and ICRA','SEBI directly'],a:2,e:'CRISIL and ICRA are the SEBI-approved valuation agencies for debt securities used in mutual fund schemes.',topic:'NAV'},
      {q:'Investment of funds pooled from unitholders is the responsibility of:',o:['Asset Management Company','Trustees','Custodian','RTA'],a:0,e:'The AMC is responsible for managing the investments of the scheme. Trustees oversee, Custodian holds securities, RTA handles investor records.',topic:'STR'},
      {q:'Mutual funds can buy and sell securities only on a delivery basis. Is this true?',o:['True','False'],a:0,e:'TRUE. Mutual funds can buy/sell securities only on delivery basis (no carry-forward / speculative trading on the same day) — to ensure investor protection and avoid speculation.',topic:'REG'},
      {q:'Regarding celebrity endorsements for mutual funds, SEBI has permitted:',o:['Endorsement of individual mutual fund schemes','Celebrity endorsement at the industry level (for awareness only)','Endorsement of NFOs only','No endorsement of any kind'],a:1,e:'SEBI permits celebrity endorsement only at INDUSTRY level (for awareness, e.g., "Mutual Funds Sahi Hai") — not for promoting individual schemes.',topic:'REG'},
      {q:'"Please read the scheme related documents carefully" — these documents refer to:',o:['SID and audited balance sheet of AMC','Trust deed and KIM','SAI and fund factsheet','Scheme Information Document and Statement of Additional Information'],a:3,e:'The "scheme related documents" referenced in the standard mutual fund disclaimer are the SID and SAI.',topic:'DOC'},
      {q:'SID and SAI are prepared in the format prescribed by:',o:['Each AMC as it desires','AMFI as part of Code of Conduct','AMFI as part of Best Practices Circular','Securities and Exchange Board of India (SEBI)'],a:3,e:'SID and SAI must follow SEBI-prescribed format. Contents flow in the same sequence as in the prescribed format.',topic:'DOC'},
      {q:'NAV of a scheme is disclosed on the website of:',o:['RBI','AMC and AMFI','Stock exchange only','Trustees'],a:1,e:'NAV is disclosed daily by 11 PM on the AMC website AND on AMFI website.',topic:'NAV'},
      {q:'Which of the following is NOT a statutory document?',o:['Fund factsheet','Statement of Additional Information','Scheme Information Document','Key Information Memorandum'],a:0,e:'Fund factsheet is NOT a statutory document — though it is published monthly. SID, SAI and KIM are statutory.',topic:'DOC'},
      {q:'As per fair valuation principles laid out by SEBI, it is mandatory to disclose the valuation policy in:',o:['SAI (Statement of Additional Information)','Account statements','Fund factsheet','Need not be disclosed publicly'],a:0,e:'Valuation policy is disclosed in the Statement of Additional Information (SAI), as part of fair valuation principles mandated by SEBI.',topic:'DOC'},
      {q:'Investors bought 20 crore units of a scheme at ₹10 each (mobilizing ₹200 crore). ₹140 crore is in equities; ₹60 crore in bank deposits. Interest/dividend accrued: ₹8 crore. Scheme expenses payable: ₹4 crore. Calculate NAV per unit.',o:['₹20.40','₹10.20','₹20.00','₹10.00'],a:1,e:'Net Assets = 140 + 60 + 8 - 4 = ₹204 cr. NAV = ₹204 cr ÷ 20 cr units = ₹10.20.',topic:'NAV'},
      {q:'Maximum Total Expense Ratio chargeable in case of Index Funds is:',o:['2.25% of daily net assets','1.5% of daily net assets','1% of daily net assets','Depends on AMC discretion'],a:2,e:'Index funds and ETFs are capped at 1% TER under SEBI regulations — given their passive nature and lower management cost.',topic:'NAV'},
      {q:'Mutual fund dividends (IDCW) can be paid only out of:',o:['Premium reserve account','Unit capital','Distributable surplus generated by the scheme','Mark-to-market unrealised profits'],a:2,e:'Dividends/IDCW can be paid only out of distributable surplus — i.e., realised gains and accumulated income, NOT from unit capital or unrealised gains.',topic:'NAV'},
      {q:'Income earned by a mutual fund scheme is:',o:['Taxed as per the marginal tax rate of investors','Exempt from tax under Section 10(23D) of Income Tax Act','Taxed at flat 10% plus surcharge','Taxed only on dividends earned'],a:1,e:'Section 10(23D) of Income Tax Act exempts all income earned by mutual fund schemes from tax. Tax incidence falls on the unitholder.',topic:'TAX'},
      {q:'Redemption from which fund attracts STT (Securities Transaction Tax) for an investor?',o:['Multi-cap mutual fund (equity-oriented)','Government Securities Fund','Liquid Fund','Overnight Fund'],a:0,e:'STT applies on redemption of equity-oriented schemes (≥65% equity). Multi-cap is equity-oriented. Debt funds (G-Sec, Liquid, Overnight) attract no STT.',topic:'TAX'},
      {q:'Whose KYC must be completed in case of an application by a minor?',o:['The minor','The guardian','Any family member of the minor','No KYC required for minors'],a:1,e:'For minor investors, the GUARDIAN must be KYC compliant. Once the minor turns 18, they must complete their own KYC and update the folio status.',topic:'OPS'},
      {q:'Investors have the right to specify up to ___ nominees for their mutual fund investment folios.',o:['Zero','One','Two','Three'],a:3,e:'Investors can specify up to 3 nominees per folio. Allocation percentages must aggregate to 100%.',topic:'OPS'},
      {q:'Unsystematic risk can be reduced through diversification. True or False?',o:['True','False'],a:0,e:'TRUE. Unsystematic (company-specific) risk is diversifiable. Systematic (market-wide) risk cannot be reduced through diversification.',topic:'RSK'},
      {q:'An investor invested at NAV ₹120 per unit and redeemed at ₹135. Calculate simple return.',o:['10.00%','11.11%','12.50%','15.00%'],a:2,e:'Simple Return = (135 - 120) / 120 × 100 = 12.50%.',topic:'PRF'},
      {q:'Which is a measure of fluctuation in periodic returns of an equity mutual fund scheme?',o:['Variance','Sharpe ratio','Modified duration','Jensen\'s Alpha'],a:0,e:'Variance (and its square root, Standard Deviation) measures the fluctuation in periodic returns. Sharpe and Alpha are risk-ADJUSTED return measures. Modified Duration applies to debt.',topic:'RSK'},
